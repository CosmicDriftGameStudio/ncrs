name: Release

on:
  push:
    tags: ["v*"]
  # Manual re-run, for when the publish itself did not happen. Releases are
  # immutable: once published, a re-run can neither replace nor add assets, so
  # a defect in a published release needs a new patch tag.
  #
  # GitHub renders a branch picker for workflow_dispatch, so this can be
  # started from any branch. The job guard below refuses anything that is not
  # main or a v* tag, and the `release` environment refuses the deployment on
  # top of that. Two gates, because write access is far easier to hand out
  # than the signing key.
  #
  # A run started from a feature branch is reported by GitHub as "likely
  # failed because of a workflow file issue", because every job in the file
  # is skipped. That is the guard working, not a broken file.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Signed and published is only what a push run of CI built on main for
  # exactly this commit. A pull request run is never accepted: it can come from
  # any branch, and what it built must not reach the signing key. The guard is
  # checked before anything is looked up, so a workflow_dispatch on some other
  # branch ends here.
  #
  # Note that GitHub also starts this workflow on a plain branch push when
  # the push touches this file, to validate it. On such a run all jobs are
  # skipped, which GitHub reports as "likely failed because of a workflow
  # file issue". That is this guard, not a syntax error.
  find-ci-run:
    name: Find the CI run
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      actions: read
      contents: read
    timeout-minutes: 120
    outputs:
      run-id: ${{ steps.find.outputs.run-id }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          hint="tag a commit that CI built green on main"
          # Newest first; only push runs of ci.yml on main, for exactly this
          # commit. The CI run of a merge may start a moment after the tag, so
          # look for it a few times before giving up.
          for _ in 1 2 3 4 5 6; do
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
              --event push --branch main --commit "$SHA" \
              --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$run_id" ] && break
            sleep 10
          done
          if [ -z "$run_id" ]; then
            echo "::error::no CI push run on main for $SHA; $hint"
            exit 1
          fi
          # Waits for a run that is still going; fails if it did not succeed. The
          # interval keeps an hour of waiting well inside the token's API limit.
          if ! gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --interval 30 --exit-status > /dev/null; then
            echo "::error::CI run $run_id for $SHA did not succeed; $hint"
            exit 1
          fi
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Using the artifacts of CI run $run_id" >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: find-ci-run
    outputs:
      published: ${{ steps.publish.outcome }}
    permissions:
      actions: read
      contents: write
    # The Apple secrets are only readable from inside this environment, and the
    # environment's protection rules decide who may release. Without it, any
    # account with write access could dispatch the workflow from a branch
    # holding modified build.rs and have ncrs signed with the maintainer's
    # certificate. Write access is a much easier thing to hand out than
    # control of the signing key, so the workflow must not treat the two as
    # equivalent.
    #
    # What the environment is configured to allow, on the repository:
    #   - deployment branches: main only
    #   - required reviewers: the maintainer
    #   - prevent self-review: on
    environment: release
    # macOS, not ubuntu: notarization is what makes Gatekeeper let a user run
    # the binary. `notarytool` and `stapler` ship only with the macOS runner, so
    # the job that publishes and the job that signs have to be the same one —
    # notarizing an archive on Linux and publishing it from another machine
    # works, but the ticket has to be stapled to the binary before the tarball
    # is built, and that needs the macOS tooling.
    runs-on: macos-latest
    steps:
      # Only for the app bundle: its Info.plist template, the icon, the
      # version in Cargo.toml and the packaging script. No build happens in
      # this job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            Cargo.toml
            scripts
            packaging/macos
            packaging/aur
            packaging/homebrew
            assets/ncrs.icns
          sparse-checkout-cone-mode: false

      # The artifacts of the CI push run on main for this commit: archives,
      # packages, the sandbox binaries and the licenses file, each under
      # artifacts/<name>/. All of them: `pattern` takes a single glob, and CI
      # uploads nothing else.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          run-id: ${{ needs.find-ci-run.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Collect archives
        run: |
          mkdir -p dist
          find artifacts \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.deb" -o -name "*.rpm" \) | while read -r f; do
            cp "$f" dist/
          done
          ls -la dist/
          # One package per Linux architecture: a missing one would publish a
          # release that install instructions point at in vain.
          for extension in deb rpm; do
            count=$(find dist -maxdepth 1 -name "*.$extension" | wc -l | tr -d ' ')
            if [ "$count" != 2 ]; then
              echo "::error::expected 2 .$extension packages in dist/, found $count"
              exit 1
            fi
          done

      - name: Sign and notarize the macOS binaries and apps
        # Without this, Gatekeeper refuses the binary with "cannot be opened
        # because it is from a developer who cannot be verified", and the only
        # way out is System Settings > Privacy > Open Anyway. That is the
        # first thing a new user sees, and it is why the file has to be
        # notarized before it is uploaded, not after.
        #
        # Besides the normal app, a sandboxed one is published as
        # ncrs-sandbox-<target>.app.zip. It is not part of the Homebrew cask.
        #
        # Not `if: secrets.… != ''`: GitHub rejects that outright, with
        # "Unrecognized named-value: 'secrets'" at parse time, which takes the
        # whole workflow down with zero jobs rather than skipping one step.
        # Secrets are not available in an `if` expression on a step.
        #
        # So the check moves into the script. A fork without Apple secrets
        # publishes unsigned binaries rather than failing the release, and the
        # script says so in the job summary — a skipped verification must not
        # read as a passed one.
        continue-on-error: false
        env:
          # base64, because a GitHub secret must be a single line and a
          # base64 blob survives the copy-and-paste into the web form.
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # Through env, never interpolated into the script: the ref name is
          # input from outside the repository's control.
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # The check that could not live in the `if` above. A fork has no
          # Apple secrets and should still be able to cut a release, so this
          # exits successfully — but it writes to the job summary, because a
          # silent pass would be read as "Gatekeeper will accept this".
          if [ -z "${APPLE_CERTIFICATE_P12:-}" ] || [ -z "${APPLE_APP_SPECIFIC_PASSWORD:-}" ]; then
            echo "### Notarization skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "No Apple secrets configured. macOS binaries are published" >> "$GITHUB_STEP_SUMMARY"
            echo "**unsigned**, and Gatekeeper will warn on first launch." >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Apple secrets not set; publishing unsigned binaries."
            exit 0
          fi

          # The app's version: the tag without its `v`. A manual re-run from
          # main has no tag, so Cargo.toml says what is being built then.
          case "$REF_NAME" in
            v[0-9]*) VERSION="${REF_NAME#v}" ;;
            *) VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1) ;;
          esac
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.+-][0-9A-Za-z.+-]+)?$'; then
            echo "::error::not a usable app version: $VERSION"
            exit 1
          fi

          # A throwaway keychain: the runner is shared state, and leaving a
          # private key behind in ~/.login would outlive the job.
          KEYCHAIN=build.keychain-db
          PASS=$(uuidgen)
          security create-keychain -p "$PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$PASS" "$KEYCHAIN"

          # Decode to a real file first. `base64 --decode` is GNU syntax and
          # does not exist on macOS, where the flag is `-D`: the command failed,
          # wrote nothing, and `security import` then reported "Unknown format"
          # on an empty file — a message that points at the certificate rather
          # than at the shell.
          #
          # A named pipe is not enough either. `security import` reads the file
          # more than once and a process substitution is not seekable.
          #
          # Whitespace is stripped first. Copying a base64 blob through a web
          # form or a terminal easily brings a line break or a trailing newline
          # along, and base64 refuses the whole input over one of them — which
          # surfaces as "error decoding base64 input stream" rather than as the
          # obvious "the secret has a stray newline in it".
          P12=$(mktemp -t identity).p12
          printf '%s' "$APPLE_CERTIFICATE_P12" | tr -d '[:space:]' | base64 -D > "$P12"
          if [ ! -s "$P12" ]; then
            echo "::error::the decoded certificate is empty — APPLE_CERTIFICATE_P12 is not valid base64"
            exit 1
          fi
          security import "$P12" \
            -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$P12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$PASS" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN"
          # shellcheck disable=SC2086
          trap 'security delete-keychain "$KEYCHAIN"' EXIT

          for archive in dist/ncrs-*-apple-darwin.tar.gz; do
            [ -e "$archive" ] || continue
            echo "::group::$(basename "$archive")"
            workdir=$(mktemp -d)
            tar -xzf "$archive" -C "$workdir"
            # The archive holds a directory named after the target, so the
            # binary sits one level down — never assume a flat layout.
            dir=$(find "$workdir" -type d -name 'ncrs-*apple-darwin' | head -n 1)
            binary="$dir/ncrs"
            library="$dir/libpdfium.dylib"
            test -x "$binary" || { echo "::error::no binary in $archive"; exit 1; }
            test -f "$library" || { echo "::error::no libpdfium.dylib in $archive"; exit 1; }

            # --options runtime makes the hardened runtime mandatory, which
            # the notary service requires. The identifier is stable across
            # releases so an update replaces the app instead of duplicating it.
            #
            # The library first, then the binary that loads it: under the
            # hardened runtime the binary refuses a library that is not signed
            # by the same team. Never `--deep`: it signs nested code with the
            # outer options and hides which file failed.
            codesign --force --sign "$APPLE_TEAM_ID" \
              --options runtime --timestamp "$library"
            codesign --verify --strict --verbose=2 "$library"
            codesign --force --sign "$APPLE_TEAM_ID" \
              --options runtime --timestamp \
              --identifier dev.cosmicdrift.ncrs "$binary"
            codesign --verify --strict --verbose=2 "$binary"

            # notarytool accepts only zip, pkg or dmg, so the signed binary and
            # library are submitted in a zip of the folder. A bare Mach-O
            # cannot carry a stapled ticket; Gatekeeper fetches it online on
            # first launch instead.
            submission="$workdir/ncrs-notarize.zip"
            ditto -c -k --keepParent "$dir" "$submission"
            xcrun notarytool submit "$submission" \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --wait --timeout 20m
            rm "$submission"

            # The licenses file is already in the extracted archive from the
            # CI build; copying again keeps the repack from depending on that.
            cp artifacts/third-party-licenses/THIRD_PARTY_LICENSES.html "$dir/"

            # Repack, so the notarized binary is what users download. The
            # checksum step below runs after this, so it covers this file.
            tar -czf "$archive" -C "$workdir" "$(basename "$dir")"

            # The app bundle holds that same binary and library. Signing the
            # bundle signs the executable again, this time bound to Info.plist
            # and the resources, which changes its CDHash. The ticket for the bare
            # binary therefore does not cover the one in the bundle, and the
            # bundle is notarized on its own. The tarball keeps the bare
            # binary, which `install.sh` and Windows-style users rely on.
            target=$(basename "$dir")
            target=${target#ncrs-}
            case "$target" in
              aarch64-*) min_macos=11.0 ;;
              *) min_macos=10.15 ;;
            esac
            # The layout (Info.plist, icon, licenses, Frameworks) lives in
            # the script; it is the same one the pull request build runs.
            scripts/package.sh app "$dir" "$VERSION" "$min_macos" "$workdir" \
              --licenses artifacts/third-party-licenses/THIRD_PARTY_LICENSES.html
            app="$workdir/ncrs.app"

            # The library inside the bundle first, then the bundle (which
            # signs the executable again, bound to Info.plist and resources).
            codesign --force --sign "$APPLE_TEAM_ID" \
              --options runtime --timestamp "$app/Contents/Frameworks/libpdfium.dylib"
            codesign --force --sign "$APPLE_TEAM_ID" \
              --options runtime --timestamp "$app"
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign --verify --strict --verbose=2 "$app/Contents/Frameworks/libpdfium.dylib"

            ditto -c -k --keepParent "$app" "$workdir/ncrs-app-notarize.zip"
            xcrun notarytool submit "$workdir/ncrs-app-notarize.zip" \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --wait --timeout 20m

            # A bundle, unlike a bare binary, can carry the ticket, so the app
            # opens without a network lookup.
            xcrun stapler staple "$app"
            xcrun stapler validate "$app"

            # ditto, not zip: it keeps the signature's extended attributes and
            # symlinks. The checksum step below covers this file too.
            ditto -c -k --keepParent "$app" "dist/ncrs-$target.app.zip"

            # The sandboxed app: the binary built with the sandbox feature in
            # the same layout, with its own bundle ID. It carries the App
            # Sandbox entitlements and is notarized on its own, like the
            # normal app. Its zip name matches the verification loop below.
            sandbox_binary="artifacts/sandbox-binary-$target/ncrs"
            test -f "$sandbox_binary" \
              || { echo "::error::no sandboxed binary for $target"; exit 1; }
            scripts/package.sh sandbox-app "$dir" "$sandbox_binary" "$VERSION" "$min_macos" "$workdir/sandbox" \
              --licenses artifacts/third-party-licenses/THIRD_PARTY_LICENSES.html
            sandbox_app="$workdir/sandbox/ncrs.app"

            codesign --force --sign "$APPLE_TEAM_ID" \
              --options runtime --timestamp "$sandbox_app/Contents/Frameworks/libpdfium.dylib"
            codesign --force --sign "$APPLE_TEAM_ID" \
              --options runtime --timestamp \
              --entitlements packaging/macos/sandbox.entitlements "$sandbox_app"
            codesign --verify --deep --strict --verbose=2 "$sandbox_app"
            scripts/package.sh check-sandbox "$sandbox_app" sandboxed

            ditto -c -k --keepParent "$sandbox_app" "$workdir/ncrs-sandbox-notarize.zip"
            xcrun notarytool submit "$workdir/ncrs-sandbox-notarize.zip" \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --wait --timeout 20m
            xcrun stapler staple "$sandbox_app"
            xcrun stapler validate "$sandbox_app"
            ditto -c -k --keepParent "$sandbox_app" "dist/ncrs-sandbox-$target.app.zip"
            rm -rf "$workdir"
            echo "::endgroup::"
          done

          # Proof rather than hope: this is the check the user's Mac makes on
          # an app, and it fails the job if the app would be rejected.
          # `spctl -a -t exec` on a bare binary reports "does not seem to be
          # an app", so only the bundle goes through it; the binary is
          # checked for a valid signature instead.
          for app_zip in dist/ncrs-*-apple-darwin.app.zip; do
            [ -e "$app_zip" ] || continue
            workdir=$(mktemp -d)
            ditto -x -k "$app_zip" "$workdir"
            verdict=$(spctl -a -t exec -vv "$workdir/ncrs.app" 2>&1) || true
            echo "$(basename "$app_zip"): $verdict"
            printf '%s\n' "$verdict" | grep -q 'accepted' \
              || { echo "::error::Gatekeeper does not accept $(basename "$app_zip")"; exit 1; }
            printf '%s\n' "$verdict" | grep -q 'source=Notarized Developer ID' \
              || { echo "::error::$(basename "$app_zip") is not notarized"; exit 1; }
            xcrun stapler validate "$workdir/ncrs.app"
            codesign --verify --strict --verbose=2 \
              "$workdir/ncrs.app/Contents/Frameworks/libpdfium.dylib"
            # Proves the normal app stays without entitlements and the
            # sandboxed one keeps them through notarization and the zip.
            case "$(basename "$app_zip")" in
              ncrs-sandbox-*) expected=sandboxed ;;
              *) expected=plain ;;
            esac
            scripts/package.sh check-sandbox "$workdir/ncrs.app" "$expected"
            rm -rf "$workdir"
          done
          for archive in dist/ncrs-*-apple-darwin.tar.gz; do
            [ -e "$archive" ] || continue
            workdir=$(mktemp -d); tar -xzf "$archive" -C "$workdir"
            binary=$(find "$workdir" -name ncrs -type f | head -n 1)
            codesign --verify --strict --verbose=2 "$binary"
            library=$(find "$workdir" -name libpdfium.dylib -type f | head -n 1)
            test -n "$library" || { echo "::error::no libpdfium.dylib in $archive"; exit 1; }
            codesign --verify --strict --verbose=2 "$library"
            rm -rf "$workdir"
          done

      - name: Licenses file for the About dialog
        # The About dialog of a build without the file links to this release
        # asset, so it has to exist on every release.
        run: cp artifacts/third-party-licenses/THIRD_PARTY_LICENSES.html dist/

      - name: Checksums
        # After notarization, never before: signing rewrites the binary, so a
        # checksum computed earlier would describe a file nobody downloads.
        #
        # `shasum` rather than `sha256sum` — this job runs on a macOS runner,
        # where the GNU spelling does not exist and the step would fail on the
        # first file. The installer looks for both.
        run: |
          cd dist
          shasum -a 256 * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        id: publish
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: dist/*
          # Not a draft: `install.sh` resolves the binaries through
          # `releases/latest/download/`, which cannot see drafts. A drafted
          # release would leave the documented install command broken.
          draft: false
          # Also not a prerelease, and that is load-bearing rather than
          # cosmetic: `releases/latest` ignores prereleases, so a prereleased
          # v0.1.0 makes `releases/latest/download/<asset>` answer 404 and
          # silently breaks the install command the README documents. Once a
          # stable v1+ exists, a prerelease mark can come back — together with
          # the installer's fallback to a pinned URL, not before.
          prerelease: false
          generate_release_notes: true

      # Pushes the new PKGBUILD of ncrs-bin to the AUR. A step of this job and
      # not a job of its own: the `release` environment asks the maintainer for
      # approval once per job, and the secret lives in that environment, so
      # setting it is the maintainer's go for the AUR push. The first push to
      # the empty AUR repository creates the package.
      - name: Update the AUR package
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ -z "${AUR_SSH_PRIVATE_KEY:-}" ]; then
            {
              echo "### AUR update skipped"
              echo "No AUR_SSH_PRIVATE_KEY secret configured; nothing was pushed to the AUR."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::AUR_SSH_PRIVATE_KEY not set; skipping the AUR update."
            exit 0
          fi

          version="${REF_NAME#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::not a usable version: $version"
            exit 1
          fi

          sha256_x86_64=$(shasum -a 256 dist/ncrs-x86_64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)
          sha256_aarch64=$(shasum -a 256 dist/ncrs-aarch64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)
          scripts/aur-package.sh "$version" "$sha256_x86_64" "$sha256_aarch64" "$RUNNER_TEMP/aur-package"

          # The key only ever lives in this folder, which is removed on exit.
          trap 'rm -rf "$RUNNER_TEMP/aur-ssh"' EXIT
          (umask 077; mkdir "$RUNNER_TEMP/aur-ssh"; printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/aur-ssh/key")
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/aur-ssh/key -o IdentitiesOnly=yes -o UserKnownHostsFile=$GITHUB_WORKSPACE/packaging/aur/known_hosts -o StrictHostKeyChecking=yes"

          git clone ssh://aur@aur.archlinux.org/ncrs-bin.git "$RUNNER_TEMP/aur-repo"
          cd "$RUNNER_TEMP/aur-repo"
          cp "$RUNNER_TEMP/aur-package/PKGBUILD" "$RUNNER_TEMP/aur-package/.SRCINFO" .
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "::notice::the AUR package is already up to date"
            exit 0
          fi
          git -c user.name='Marc Frost' -c user.email='155059128+bender0oo0@users.noreply.github.com' \
            commit -m "Update to $version"
          git push origin HEAD:master

      # Opens the pull request that bumps Casks/ncrs.rb in the tap
      # CosmicDriftGameStudio/homebrew-ncrs; it is merged there by hand. A step
      # of this job for the same reason as the AUR step above.
      - name: Open the Homebrew tap update
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          # Fine-grained, limited to homebrew-ncrs: Contents and Pull requests
          # read/write. The runner's own token cannot write to the tap and is
          # never used for it.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            {
              echo "### Homebrew tap update skipped"
              echo "No HOMEBREW_TAP_TOKEN secret configured; no pull request was opened in CosmicDriftGameStudio/homebrew-ncrs."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::HOMEBREW_TAP_TOKEN not set; skipping the Homebrew tap update."
            exit 0
          fi

          version="${REF_NAME#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::not a usable version: $version"
            exit 1
          fi

          sha256_arm=$(shasum -a 256 dist/ncrs-aarch64-apple-darwin.app.zip | cut -d' ' -f1)
          sha256_intel=$(shasum -a 256 dist/ncrs-x86_64-apple-darwin.app.zip | cut -d' ' -f1)
          scripts/homebrew-cask.sh "$version" "$sha256_arm" "$sha256_intel" "$RUNNER_TEMP/homebrew-cask"

          # git gets the token from this helper, which reads it from the
          # environment: it is never an argument, never in the remote URL or
          # .git/config. The empty helper first drops the runner's keychain.
          tap_git() {
            git -c credential.helper= \
              -c 'credential.helper=!f() { echo username=x-access-token; echo "password=$HOMEBREW_TAP_TOKEN"; }; f' \
              "$@"
          }
          tap="$RUNNER_TEMP/homebrew-tap"
          branch="ncrs-$version"
          tap_git clone --depth 1 https://github.com/CosmicDriftGameStudio/homebrew-ncrs.git "$tap"
          cd "$tap"
          git checkout -b "$branch"
          cp "$RUNNER_TEMP/homebrew-cask/ncrs.rb" Casks/ncrs.rb
          git add Casks/ncrs.rb
          if git diff --cached --quiet; then
            echo "::notice::the cask in the tap is already at $version"
            exit 0
          fi
          git -c user.name='Marc Frost' -c user.email='155059128+bender0oo0@users.noreply.github.com' \
            commit -m "ncrs $version"
          # Forced, so a re-run updates the branch of the first attempt.
          tap_git push --force origin "HEAD:refs/heads/$branch"

          open_prs=$(GH_TOKEN="$HOMEBREW_TAP_TOKEN" gh pr list --repo CosmicDriftGameStudio/homebrew-ncrs \
            --head "$branch" --state open --json number --jq length)
          if [ "$open_prs" != 0 ]; then
            echo "::notice::the pull request for $branch is open already and was updated"
            exit 0
          fi
          GH_TOKEN="$HOMEBREW_TAP_TOKEN" gh pr create --repo CosmicDriftGameStudio/homebrew-ncrs \
            --head "$branch" --title "ncrs $version" \
            --body "Bumps the cask to ncrs $version (https://github.com/CosmicDriftGameStudio/ncrs/releases/tag/$REF_NAME)."

      # Opens the update pull request in microsoft/winget-pkgs for the release
      # just published. komac forks the repository under the account of the
      # token, so that account needs no other rights than public_repo. A step
      # of this job and not a job of its own: the `release` environment asks
      # the maintainer for approval once per job. It runs last, so a failure
      # here cannot keep the release from being published.
      - name: Submit the winget update
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          # A classic token with public_repo; komac cannot open the pull
          # request with a fine-grained one. Empty on a fork, see below.
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          # Only for the existence check below, never the winget token.
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Checked here and not in an `if`, for the reason given at the
          # notarization step above. A fork has no token and still releases.
          if [ -z "${WINGET_TOKEN:-}" ]; then
            {
              echo "### winget update skipped"
              echo "No WINGET_TOKEN secret configured; nothing was submitted to microsoft/winget-pkgs."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::WINGET_TOKEN not set; skipping the winget update."
            exit 0
          fi

          version="${REF_NAME#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::not a usable version: $version"
            exit 1
          fi

          # komac only updates a package that already exists in winget-pkgs.
          # Until the first version is merged there, skip instead of turning
          # the run red after the release is already published.
          if ! gh api repos/microsoft/winget-pkgs/contents/manifests/c/CosmicDriftGameStudio/ncrs --silent; then
            {
              echo "### winget update skipped"
              echo "CosmicDriftGameStudio.ncrs is not in microsoft/winget-pkgs yet:"
              echo "the first version must be submitted by hand (scripts/winget-manifests.sh)."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::package not in winget-pkgs yet; skipping the winget update."
            exit 0
          fi

          scripts/fetch-komac.sh target/komac
          # The token goes in through the environment of this one command,
          # never as an argument, so it cannot show up in a process listing.
          # komac reads its token from GITHUB_TOKEN (`--help` says so). The
          # runner's own token is unset first so komac can never use it.
          env -u GH_TOKEN GITHUB_TOKEN="$WINGET_TOKEN" target/komac/komac update CosmicDriftGameStudio.ncrs \
            --version "$version" \
            --urls "https://github.com/$REPOSITORY/releases/download/$REF_NAME/ncrs-x86_64-pc-windows-msvc.zip" \
            --submit

      # Last and gated on the outcome of the publish step: the GitHub assets,
      # brew, AUR and winget are out before it, a failed upload fails the job
      # without blocking them, and a failure in those steps does not suppress
      # it. Push only: a workflow_dispatch on a tag is a re-run and would
      # collide with the build number already uploaded. CFBundleVersion is the
      # X.Y.Z version (package_app), unique per real tag, so a rejected build
      # needs a new patch tag.
      - name: Upload the App Store build
        if: ${{ !cancelled() && steps.publish.outcome == 'success' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        env:
          # base64, like the Developer ID certificate above.
          MAS_APP_CERTIFICATE_P12: ${{ secrets.MAS_APP_CERTIFICATE_P12 }}
          MAS_INSTALLER_CERTIFICATE_P12: ${{ secrets.MAS_INSTALLER_CERTIFICATE_P12 }}
          MAS_CERTIFICATE_PASSWORD: ${{ secrets.MAS_CERTIFICATE_PASSWORD }}
          MAS_PROVISIONING_PROFILE: ${{ secrets.MAS_PROVISIONING_PROFILE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          VERSION="${REF_NAME#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "### App Store upload skipped: pre-release tag" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          missing=""
          for name in MAS_APP_CERTIFICATE_P12 MAS_INSTALLER_CERTIFICATE_P12 MAS_CERTIFICATE_PASSWORD \
            MAS_PROVISIONING_PROFILE APPLE_ID APPLE_APP_SPECIFIC_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            {
              echo "### App Store upload skipped"
              echo "Missing secrets:$missing"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::App Store upload skipped, missing secrets:$missing"
            exit 0
          fi

          umask 077
          work="$RUNNER_TEMP/app-store"
          mkdir "$work"

          KEYCHAIN="$RUNNER_TEMP/app-store.keychain-db"
          PASS=$(uuidgen)
          security create-keychain -p "$PASS" "$KEYCHAIN"
          trap 'security delete-keychain "$KEYCHAIN" 2>/dev/null || true; rm -rf "$work"' EXIT
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$PASS" "$KEYCHAIN"

          printf '%s' "$MAS_APP_CERTIFICATE_P12" | tr -d '[:space:]' | base64 -D > "$work/app.p12"
          if [ ! -s "$work/app.p12" ]; then
            echo "::error::the decoded certificate is empty — MAS_APP_CERTIFICATE_P12 is not valid base64"
            exit 1
          fi
          printf '%s' "$MAS_INSTALLER_CERTIFICATE_P12" | tr -d '[:space:]' | base64 -D > "$work/installer.p12"
          if [ ! -s "$work/installer.p12" ]; then
            echo "::error::the decoded certificate is empty — MAS_INSTALLER_CERTIFICATE_P12 is not valid base64"
            exit 1
          fi
          printf '%s' "$MAS_PROVISIONING_PROFILE" | tr -d '[:space:]' | base64 -D > "$work/ncrs.provisionprofile"
          if [ ! -s "$work/ncrs.provisionprofile" ]; then
            echo "::error::the decoded profile is empty — MAS_PROVISIONING_PROFILE is not valid base64"
            exit 1
          fi

          security import "$work/app.p12" -k "$KEYCHAIN" -P "$MAS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security import "$work/installer.p12" -k "$KEYCHAIN" -P "$MAS_CERTIFICATE_PASSWORD" -T /usr/bin/productbuild
          rm -f "$work/app.p12" "$work/installer.p12"
          # Back to the default before the bundle is built: the .pkg records
          # its modes, and an app installed owner-only does not start for
          # anyone but root.
          umask 022

          # Apple Distribution and the installer certificate chain to this
          # intermediate; the runner image is not guaranteed to have it. An
          # intermediate is no trust anchor, the chain still has to end at
          # Apple's root.
          curl --fail --silent --show-error --location -o "$work/AppleWWDRCAG3.cer" \
            https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import "$work/AppleWWDRCAG3.cer" -k "$KEYCHAIN"

          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$PASS" "$KEYCHAIN" > /dev/null
          # The signing step's trap deleted its keychain, so the search list
          # points at a dead file.
          security list-keychain -d user -s "$KEYCHAIN"

          APP_IDENTITY="Apple Distribution: Marc Frost (2ZJ4C4D9SP)"
          INSTALLER_IDENTITY="3rd Party Mac Developer Installer: Marc Frost (2ZJ4C4D9SP)"
          if ! security find-certificate -c "$APP_IDENTITY" "$KEYCHAIN" > /dev/null; then
            echo "::error::no certificate named $APP_IDENTITY in MAS_APP_CERTIFICATE_P12"
            exit 1
          fi
          if ! security find-certificate -c "$INSTALLER_IDENTITY" "$KEYCHAIN" > /dev/null; then
            echo "::error::no certificate named $INSTALLER_IDENTITY in MAS_INSTALLER_CERTIFICATE_P12"
            exit 1
          fi

          for t in x86_64-apple-darwin aarch64-apple-darwin; do
            mkdir "$work/$t"
            tar -xzf "artifacts/ncrs-$t/ncrs-$t.tar.gz" -C "$work/$t"
            for f in "$work/$t/ncrs-$t/ncrs" "$work/$t/ncrs-$t/libpdfium.dylib" "artifacts/sandbox-binary-$t/ncrs"; do
              if [ ! -f "$f" ]; then
                echo "::error::missing $f"
                exit 1
              fi
            done
          done
          cp -R "$work/aarch64-apple-darwin/ncrs-aarch64-apple-darwin" "$work/universal"
          lipo -create "$work/x86_64-apple-darwin/ncrs-x86_64-apple-darwin/libpdfium.dylib" \
            "$work/aarch64-apple-darwin/ncrs-aarch64-apple-darwin/libpdfium.dylib" \
            -output "$work/universal/libpdfium.dylib"
          lipo -create artifacts/sandbox-binary-x86_64-apple-darwin/ncrs \
            artifacts/sandbox-binary-aarch64-apple-darwin/ncrs \
            -output "$work/ncrs-store"
          chmod +x "$work/ncrs-store"
          scripts/package.sh store-app "$work/universal" "$work/ncrs-store" "$VERSION" \
            "$work/ncrs.provisionprofile" "$work/store" \
            --licenses artifacts/third-party-licenses/THIRD_PARTY_LICENSES.html
          app="$work/store/ncrs.app"

          # The profile must grant exactly the identifiers the app is signed
          # with, and be an App Store one: a development or ad-hoc profile
          # lists devices. The identifiers are not secret.
          PLISTBUDDY=/usr/libexec/PlistBuddy
          security cms -D -i "$work/ncrs.provisionprofile" > "$work/profile.plist"
          for key in com.apple.application-identifier com.apple.developer.team-identifier; do
            in_profile=$("$PLISTBUDDY" -c "Print :Entitlements:$key" "$work/profile.plist") \
              || { echo "::error::the profile grants no $key"; exit 1; }
            in_app=$("$PLISTBUDDY" -c "Print :$key" "$work/store/store.entitlements") \
              || { echo "::error::store.entitlements has no $key"; exit 1; }
            if [ "$in_profile" != "$in_app" ]; then
              echo "::error::$key is $in_profile in the profile but $in_app in the entitlements"
              exit 1
            fi
          done
          if "$PLISTBUDDY" -c 'Print :ProvisionedDevices' "$work/profile.plist" > /dev/null 2>&1; then
            echo "::error::MAS_PROVISIONING_PROFILE lists devices: a development or ad-hoc profile, not an App Store one"
            exit 1
          fi

          codesign --force --sign "$APP_IDENTITY" --keychain "$KEYCHAIN" "$app/Contents/Frameworks/libpdfium.dylib"
          codesign --force --sign "$APP_IDENTITY" --keychain "$KEYCHAIN" \
            --entitlements "$work/store/store.entitlements" "$app"
          scripts/package.sh check-store "$app" "$work/ncrs.provisionprofile" arm64 x86_64

          pkg="$work/ncrs-$VERSION.pkg"
          productbuild --component "$app" /Applications --sign "$INSTALLER_IDENTITY" --keychain "$KEYCHAIN" "$pkg"
          pkgutil --check-signature "$pkg"

          # App Store Connect rejects builds from too old an SDK (ITMS-90725);
          # this shows the SDK and minimum macOS of every slice, as the build
          # jobs linked them (this runner's own SDK does not matter).
          xcrun vtool -show-build "$app/Contents/MacOS/ncrs" || true
          xcrun vtool -show-build "$app/Contents/Frameworks/libpdfium.dylib" || true

          # @env: keeps the password out of the argument list.
          xcrun altool --validate-app -f "$pkg" -t macos -u "$APPLE_ID" -p @env:APPLE_APP_SPECIFIC_PASSWORD
          xcrun altool --upload-app -f "$pkg" -t macos -u "$APPLE_ID" -p @env:APPLE_APP_SPECIFIC_PASSWORD

          echo "Uploaded build $VERSION (universal) to App Store Connect. Export compliance is answered there per build." >> "$GITHUB_STEP_SUMMARY"

  # The apt and dnf repositories, signed with the packages key, live in their
  # own workflow so they can also be published by hand. It runs when the
  # release is public, even if AUR, brew, winget or the App Store step failed,
  # because the packages are out then and belong in the repo.
  package-repos:
    needs: release
    if: ${{ !cancelled() && needs.release.outputs.published == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    uses: ./.github/workflows/package-repos.yml
    with:
      tag: ${{ github.ref_name }}
    permissions:
      contents: read
      pages: write
      id-token: write
