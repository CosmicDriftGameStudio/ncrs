name: Release

on:
  push:
    tags: ["v*"]
  # Manual re-run, for when a release has to be rebuilt and republished
  # without cutting a new tag.
  #
  # GitHub renders a branch picker for workflow_dispatch, so this can be
  # started from any branch. The job guard below refuses anything that is not
  # main or a v* tag, and the `release` environment refuses the deployment on
  # top of that. Two gates, because write access is far easier to hand out
  # than the signing key.
  #
  # A run started from a feature branch is reported by GitHub as "likely
  # failed because of a workflow file issue", because every job in the file
  # is skipped. That is the guard working, not a broken file.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  licenses:
    name: Third-party licenses
    runs-on: ubuntu-latest
    # Installs a crate from crates.io, so it gets no write token: whatever
    # runs here cannot touch the repository or the release.
    permissions:
      contents: read
    # Same guard as `build`: the file ships inside the signed archives, so it
    # is generated from main or a release tag only.
    if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # `--features cli` is required: without it cargo-about 0.9 installs no
      # binary. Pinned and --locked so a release does not change with a new
      # cargo-about version.
      - name: Install cargo-about
        run: cargo install cargo-about --locked --version 0.9.2 --features cli

      # Once for all five targets (about.toml lists them), so every archive
      # gets the same file and the Windows-only crates are not missed.
      - name: Generate THIRD_PARTY_LICENSES.html
        run: cargo about generate about.hbs -o THIRD_PARTY_LICENSES.html

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: third-party-licenses
          path: THIRD_PARTY_LICENSES.html
          if-no-files-found: error

  build:
    needs: licenses
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # The build job runs before the environment-protected release job and
    # produces what gets signed, so it needs the same guarantee: only main
    # may be built for a release. A `workflow_dispatch` on some other branch
    # would otherwise compile that branch and feed it to notarization, which
    # turns a manual re-run into a signing oracle for whatever is on it.
    #
    # Only main or a release tag may be built. A workflow_dispatch can be
    # started from any branch, and whatever is built here is what gets signed
    # and notarized, so the ref has to be checked before the first compile —
    # not after, when a binary already exists.
    #
    # Note that GitHub also starts this workflow on a plain branch push when
    # the push touches this file, to validate it. On such a run both jobs are
    # skipped, which GitHub reports as "likely failed because of a workflow
    # file issue". That is this guard, not a syntax error.
    if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The build image's glibc is the oldest one the binary runs on;
          # 24.04 keeps it at 2.39, `ubuntu-latest` would raise it.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04
            archive: tar.gz
          - target: x86_64-apple-darwin
            # `macos-latest` is arm64 since macOS 15. Intel runners are
            # separate labels now; building x86_64 on the arm64 image would
            # either fail or silently cross-compile.
            os: macos-15-intel
            archive: tar.gz
          - target: aarch64-apple-darwin
            # Native: `macos-latest` is the M1 image, so no cross-linker.
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}

      # The windowing backend needs these; the renderer itself is pure Rust.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libfontconfig1-dev \
            cmake libclang-dev rpm

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}

      # aarch64 Linux is cross-compiled on the x86_64 runner.
      - name: Add cross linker for aarch64 Linux
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          # bindgen (llama.cpp's bindings) finds the target's headers here.
          echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_unknown_linux_gnu=--sysroot=/usr/aarch64-linux-gnu" >> "$GITHUB_ENV"

      # ggml (llama.cpp) uses std::filesystem, which macOS has from 10.15.
      - name: Set the macOS deployment target
        if: runner.os == 'macOS'
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            aarch64-*) echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV" ;;
            *) echo "MACOSX_DEPLOYMENT_TARGET=10.15" >> "$GITHUB_ENV" ;;
          esac

      # GPU with software fallback: measured fast on a high-resolution display,
      # and still starts on a machine without a usable GPU.
      - name: Build
        run: cargo build --release --features gpu-with-fallback --target ${{ matrix.target }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: third-party-licenses

      # The library is the one the app loads at runtime, next to the binary.
      - name: Fetch pdfium
        shell: bash
        run: scripts/fetch-pdfium.sh ${{ matrix.target }} target/pdfium

      - name: Package
        shell: bash
        run: |
          binary=target/${{ matrix.target }}/release/ncrs
          if [ "${{ runner.os }}" = Windows ]; then binary="$binary.exe"; fi
          scripts/package.sh archive ${{ matrix.target }} "$binary" target/pdfium . \
            --licenses THIRD_PARTY_LICENSES.html

      # From the staged archive above, so the packages hold the very binary,
      # library and licenses of the tarball. They are named
      # ncrs-<target>.deb/.rpm, which the upload glob below picks up.
      - name: Package the .deb and .rpm
        if: runner.os == 'Linux'
        run: |
          scripts/fetch-nfpm.sh target/nfpm
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          scripts/package.sh linux-packages ${{ matrix.target }} \
            ncrs-${{ matrix.target }} "$version" . target/nfpm/nfpm

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ncrs-${{ matrix.target }}
          path: |
            ncrs-${{ matrix.target }}.*
            ncrs-${{ matrix.target }}-portable.zip
          if-no-files-found: error

  release:
    needs: build
    # The Apple secrets are only readable from inside this environment, and the
    # environment's protection rules decide who may release. Without it, any
    # account with write access could dispatch the workflow from a branch
    # holding modified build.rs and have ncrs signed with the maintainer's
    # certificate. Write access is a much easier thing to hand out than
    # control of the signing key, so the workflow must not treat the two as
    # equivalent.
    #
    # What the environment is configured to allow, on the repository:
    #   - deployment branches: main only
    #   - required reviewers: the maintainer
    #   - prevent self-review: on
    environment: release
    # macOS, not ubuntu: notarization is what makes Gatekeeper let a user run
    # the binary. `notarytool` and `stapler` ship only with the macOS runner, so
    # the job that publishes and the job that signs have to be the same one —
    # notarizing an archive on Linux and publishing it from another machine
    # works, but the ticket has to be stapled to the binary before the tarball
    # is built, and that needs the macOS tooling.
    runs-on: macos-latest
    steps:
      # Only for the app bundle: its Info.plist template, the icon, the
      # version in Cargo.toml and the packaging script. No build happens in
      # this job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            Cargo.toml
            scripts
            packaging/macos
            packaging/aur
            assets/ncrs.icns
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts

      - name: Collect archives
        run: |
          mkdir -p dist
          find artifacts \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.deb" -o -name "*.rpm" \) | while read -r f; do
            cp "$f" dist/
          done
          ls -la dist/
          # One package per Linux architecture: a missing one would publish a
          # release that install instructions point at in vain.
          for extension in deb rpm; do
            count=$(find dist -maxdepth 1 -name "*.$extension" | wc -l | tr -d ' ')
            if [ "$count" != 2 ]; then
              echo "::error::expected 2 .$extension packages in dist/, found $count"
              exit 1
            fi
          done

      - name: Sign and notarize the macOS binaries and apps
        # Without this, Gatekeeper refuses the binary with "cannot be opened
        # because it is from a developer who cannot be verified", and the only
        # way out is System Settings > Privacy > Open Anyway. That is the
        # first thing a new user sees, and it is why the file has to be
        # notarized before it is uploaded, not after.
        #
        # Not `if: secrets.… != ''`: GitHub rejects that outright, with
        # "Unrecognized named-value: 'secrets'" at parse time, which takes the
        # whole workflow down with zero jobs rather than skipping one step.
        # Secrets are not available in an `if` expression on a step.
        #
        # So the check moves into the script. A fork without Apple secrets
        # publishes unsigned binaries rather than failing the release, and the
        # script says so in the job summary — a skipped verification must not
        # read as a passed one.
        continue-on-error: false
        env:
          # base64, because a GitHub secret must be a single line and a
          # base64 blob survives the copy-and-paste into the web form.
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # Through env, never interpolated into the script: the ref name is
          # input from outside the repository's control.
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # The check that could not live in the `if` above. A fork has no
          # Apple secrets and should still be able to cut a release, so this
          # exits successfully — but it writes to the job summary, because a
          # silent pass would be read as "Gatekeeper will accept this".
          if [ -z "${APPLE_CERTIFICATE_P12:-}" ] || [ -z "${APPLE_APP_SPECIFIC_PASSWORD:-}" ]; then
            echo "### Notarization skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "No Apple secrets configured. macOS binaries are published" >> "$GITHUB_STEP_SUMMARY"
            echo "**unsigned**, and Gatekeeper will warn on first launch." >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Apple secrets not set; publishing unsigned binaries."
            exit 0
          fi

          # The app's version: the tag without its `v`. A manual re-run from
          # main has no tag, so Cargo.toml says what is being built then.
          case "$REF_NAME" in
            v[0-9]*) VERSION="${REF_NAME#v}" ;;
            *) VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1) ;;
          esac
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.+-][0-9A-Za-z.+-]+)?$'; then
            echo "::error::not a usable app version: $VERSION"
            exit 1
          fi

          # A throwaway keychain: the runner is shared state, and leaving a
          # private key behind in ~/.login would outlive the job.
          KEYCHAIN=build.keychain-db
          PASS=$(uuidgen)
          security create-keychain -p "$PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$PASS" "$KEYCHAIN"

          # Decode to a real file first. `base64 --decode` is GNU syntax and
          # does not exist on macOS, where the flag is `-D`: the command failed,
          # wrote nothing, and `security import` then reported "Unknown format"
          # on an empty file — a message that points at the certificate rather
          # than at the shell.
          #
          # A named pipe is not enough either. `security import` reads the file
          # more than once and a process substitution is not seekable.
          #
          # Whitespace is stripped first. Copying a base64 blob through a web
          # form or a terminal easily brings a line break or a trailing newline
          # along, and base64 refuses the whole input over one of them — which
          # surfaces as "error decoding base64 input stream" rather than as the
          # obvious "the secret has a stray newline in it".
          P12=$(mktemp -t identity).p12
          printf '%s' "$APPLE_CERTIFICATE_P12" | tr -d '[:space:]' | base64 -D > "$P12"
          if [ ! -s "$P12" ]; then
            echo "::error::the decoded certificate is empty — APPLE_CERTIFICATE_P12 is not valid base64"
            exit 1
          fi
          security import "$P12" \
            -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$P12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$PASS" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN"
          # shellcheck disable=SC2086
          trap 'security delete-keychain "$KEYCHAIN"' EXIT

          for archive in dist/ncrs-*-apple-darwin.tar.gz; do
            [ -e "$archive" ] || continue
            echo "::group::$(basename "$archive")"
            workdir=$(mktemp -d)
            tar -xzf "$archive" -C "$workdir"
            # The archive holds a directory named after the target, so the
            # binary sits one level down — never assume a flat layout.
            dir=$(find "$workdir" -type d -name 'ncrs-*apple-darwin' | head -n 1)
            binary="$dir/ncrs"
            library="$dir/libpdfium.dylib"
            test -x "$binary" || { echo "::error::no binary in $archive"; exit 1; }
            test -f "$library" || { echo "::error::no libpdfium.dylib in $archive"; exit 1; }

            # --options runtime makes the hardened runtime mandatory, which
            # the notary service requires. The identifier is stable across
            # releases so an update replaces the app instead of duplicating it.
            #
            # The library first, then the binary that loads it: under the
            # hardened runtime the binary refuses a library that is not signed
            # by the same team. Never `--deep`: it signs nested code with the
            # outer options and hides which file failed.
            codesign --force --sign "$APPLE_TEAM_ID" \
              --options runtime --timestamp "$library"
            codesign --verify --strict --verbose=2 "$library"
            codesign --force --sign "$APPLE_TEAM_ID" \
              --options runtime --timestamp \
              --identifier dev.cosmicdrift.ncrs "$binary"
            codesign --verify --strict --verbose=2 "$binary"

            # notarytool accepts only zip, pkg or dmg, so the signed binary and
            # library are submitted in a zip of the folder. A bare Mach-O
            # cannot carry a stapled ticket; Gatekeeper fetches it online on
            # first launch instead.
            submission="$workdir/ncrs-notarize.zip"
            ditto -c -k --keepParent "$dir" "$submission"
            xcrun notarytool submit "$submission" \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --wait --timeout 20m
            rm "$submission"

            # The licenses file is already in the extracted archive from the
            # build job; copying again keeps the repack from depending on that.
            cp artifacts/third-party-licenses/THIRD_PARTY_LICENSES.html "$dir/"

            # Repack, so the notarized binary is what users download. The
            # checksum step below runs after this, so it covers this file.
            tar -czf "$archive" -C "$workdir" "$(basename "$dir")"

            # The app bundle holds that same binary and library. Signing the
            # bundle signs the executable again, this time bound to Info.plist
            # and the resources, which changes its CDHash. The ticket for the bare
            # binary therefore does not cover the one in the bundle, and the
            # bundle is notarized on its own. The tarball keeps the bare
            # binary, which `install.sh` and Windows-style users rely on.
            target=$(basename "$dir")
            target=${target#ncrs-}
            case "$target" in
              aarch64-*) min_macos=11.0 ;;
              *) min_macos=10.15 ;;
            esac
            # The layout (Info.plist, icon, licenses, Frameworks) lives in
            # the script; it is the same one the pull request build runs.
            scripts/package.sh app "$dir" "$VERSION" "$min_macos" "$workdir" \
              --licenses artifacts/third-party-licenses/THIRD_PARTY_LICENSES.html
            app="$workdir/ncrs.app"

            # The library inside the bundle first, then the bundle (which
            # signs the executable again, bound to Info.plist and resources).
            codesign --force --sign "$APPLE_TEAM_ID" \
              --options runtime --timestamp "$app/Contents/Frameworks/libpdfium.dylib"
            codesign --force --sign "$APPLE_TEAM_ID" \
              --options runtime --timestamp "$app"
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign --verify --strict --verbose=2 "$app/Contents/Frameworks/libpdfium.dylib"

            ditto -c -k --keepParent "$app" "$workdir/ncrs-app-notarize.zip"
            xcrun notarytool submit "$workdir/ncrs-app-notarize.zip" \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --wait --timeout 20m

            # A bundle, unlike a bare binary, can carry the ticket, so the app
            # opens without a network lookup.
            xcrun stapler staple "$app"
            xcrun stapler validate "$app"

            # ditto, not zip: it keeps the signature's extended attributes and
            # symlinks. The checksum step below covers this file too.
            ditto -c -k --keepParent "$app" "dist/ncrs-$target.app.zip"
            rm -rf "$workdir"
            echo "::endgroup::"
          done

          # Proof rather than hope: this is the check the user's Mac makes on
          # an app, and it fails the job if the app would be rejected.
          # `spctl -a -t exec` on a bare binary reports "does not seem to be
          # an app", so only the bundle goes through it; the binary is
          # checked for a valid signature instead.
          for app_zip in dist/ncrs-*-apple-darwin.app.zip; do
            [ -e "$app_zip" ] || continue
            workdir=$(mktemp -d)
            ditto -x -k "$app_zip" "$workdir"
            verdict=$(spctl -a -t exec -vv "$workdir/ncrs.app" 2>&1) || true
            echo "$(basename "$app_zip"): $verdict"
            printf '%s\n' "$verdict" | grep -q 'accepted' \
              || { echo "::error::Gatekeeper does not accept $(basename "$app_zip")"; exit 1; }
            printf '%s\n' "$verdict" | grep -q 'source=Notarized Developer ID' \
              || { echo "::error::$(basename "$app_zip") is not notarized"; exit 1; }
            xcrun stapler validate "$workdir/ncrs.app"
            codesign --verify --strict --verbose=2 \
              "$workdir/ncrs.app/Contents/Frameworks/libpdfium.dylib"
            rm -rf "$workdir"
          done
          for archive in dist/ncrs-*-apple-darwin.tar.gz; do
            [ -e "$archive" ] || continue
            workdir=$(mktemp -d); tar -xzf "$archive" -C "$workdir"
            binary=$(find "$workdir" -name ncrs -type f | head -n 1)
            codesign --verify --strict --verbose=2 "$binary"
            library=$(find "$workdir" -name libpdfium.dylib -type f | head -n 1)
            test -n "$library" || { echo "::error::no libpdfium.dylib in $archive"; exit 1; }
            codesign --verify --strict --verbose=2 "$library"
            rm -rf "$workdir"
          done

      - name: Checksums
        # After notarization, never before: signing rewrites the binary, so a
        # checksum computed earlier would describe a file nobody downloads.
        #
        # `shasum` rather than `sha256sum` — this job runs on a macOS runner,
        # where the GNU spelling does not exist and the step would fail on the
        # first file. The installer looks for both.
        run: |
          cd dist
          shasum -a 256 * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: dist/*
          # Not a draft: `install.sh` resolves the binaries through
          # `releases/latest/download/`, which cannot see drafts. A drafted
          # release would leave the documented install command broken.
          draft: false
          # Also not a prerelease, and that is load-bearing rather than
          # cosmetic: `releases/latest` ignores prereleases, so a prereleased
          # v0.1.0 makes `releases/latest/download/<asset>` answer 404 and
          # silently breaks the install command the README documents. Once a
          # stable v1+ exists, a prerelease mark can come back — together with
          # the installer's fallback to a pinned URL, not before.
          prerelease: false
          generate_release_notes: true

      # Pushes the new PKGBUILD of ncrs-bin to the AUR. A step of this job and
      # not a job of its own: the `release` environment asks the maintainer for
      # approval once per job, and the secret lives in that environment, so
      # setting it is the maintainer's go for the AUR push. The first push to
      # the empty AUR repository creates the package.
      - name: Update the AUR package
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ -z "${AUR_SSH_PRIVATE_KEY:-}" ]; then
            {
              echo "### AUR update skipped"
              echo "No AUR_SSH_PRIVATE_KEY secret configured; nothing was pushed to the AUR."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::AUR_SSH_PRIVATE_KEY not set; skipping the AUR update."
            exit 0
          fi

          version="${REF_NAME#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::not a usable version: $version"
            exit 1
          fi

          sha256_x86_64=$(shasum -a 256 dist/ncrs-x86_64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)
          sha256_aarch64=$(shasum -a 256 dist/ncrs-aarch64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)
          scripts/aur-package.sh "$version" "$sha256_x86_64" "$sha256_aarch64" "$RUNNER_TEMP/aur-package"

          # The key only ever lives in this folder, which is removed on exit.
          trap 'rm -rf "$RUNNER_TEMP/aur-ssh"' EXIT
          (umask 077; mkdir "$RUNNER_TEMP/aur-ssh"; printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/aur-ssh/key")
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/aur-ssh/key -o IdentitiesOnly=yes -o UserKnownHostsFile=$GITHUB_WORKSPACE/packaging/aur/known_hosts -o StrictHostKeyChecking=yes"

          git clone ssh://aur@aur.archlinux.org/ncrs-bin.git "$RUNNER_TEMP/aur-repo"
          cd "$RUNNER_TEMP/aur-repo"
          cp "$RUNNER_TEMP/aur-package/PKGBUILD" "$RUNNER_TEMP/aur-package/.SRCINFO" .
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "::notice::the AUR package is already up to date"
            exit 0
          fi
          git -c user.name='Marc Frost' -c user.email='155059128+bender0oo0@users.noreply.github.com' \
            commit -m "Update to $version"
          git push origin HEAD:master

      # Opens the update pull request in microsoft/winget-pkgs for the release
      # just published. komac forks the repository under the account of the
      # token, so that account needs no other rights than public_repo. A step
      # of this job and not a job of its own: the `release` environment asks
      # the maintainer for approval once per job. It runs last, so a failure
      # here cannot keep the release from being published.
      - name: Submit the winget update
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          # A classic token with public_repo; komac cannot open the pull
          # request with a fine-grained one. Empty on a fork, see below.
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          # Only for the existence check below, never the winget token.
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Checked here and not in an `if`, for the reason given at the
          # notarization step above. A fork has no token and still releases.
          if [ -z "${WINGET_TOKEN:-}" ]; then
            {
              echo "### winget update skipped"
              echo "No WINGET_TOKEN secret configured; nothing was submitted to microsoft/winget-pkgs."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::WINGET_TOKEN not set; skipping the winget update."
            exit 0
          fi

          version="${REF_NAME#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::not a usable version: $version"
            exit 1
          fi

          # komac only updates a package that already exists in winget-pkgs.
          # Until the first version is merged there, skip instead of turning
          # the run red after the release is already published.
          if ! gh api repos/microsoft/winget-pkgs/contents/manifests/c/CosmicDriftGameStudio/ncrs --silent; then
            {
              echo "### winget update skipped"
              echo "CosmicDriftGameStudio.ncrs is not in microsoft/winget-pkgs yet:"
              echo "the first version must be submitted by hand (scripts/winget-manifests.sh)."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::package not in winget-pkgs yet; skipping the winget update."
            exit 0
          fi

          scripts/fetch-komac.sh target/komac
          # The token goes in through the environment of this one command,
          # never as an argument, so it cannot show up in a process listing.
          # komac reads its token from GITHUB_TOKEN (`--help` says so). The
          # runner's own token is unset first so komac can never use it.
          env -u GH_TOKEN GITHUB_TOKEN="$WINGET_TOKEN" target/komac/komac update CosmicDriftGameStudio.ncrs \
            --version "$version" \
            --urls "https://github.com/$REPOSITORY/releases/download/$REF_NAME/ncrs-x86_64-pc-windows-msvc.zip" \
            --submit
