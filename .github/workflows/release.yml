name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            # `macos-latest` is arm64 since macOS 15. Intel runners are
            # separate labels now; building x86_64 on the arm64 image would
            # either fail or silently cross-compile.
            os: macos-15-intel
            archive: tar.gz
          - target: aarch64-apple-darwin
            # Native: `macos-latest` is the M1 image, so no cross-linker.
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}

      # The windowing backend needs these; the renderer itself is pure Rust.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libfontconfig1-dev

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: ${{ matrix.target }}

      # aarch64 Linux is cross-compiled on the x86_64 runner.
      - name: Add cross linker for aarch64 Linux
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      # GPU with software fallback: measured fast on a high-resolution display,
      # and still starts on a machine without a usable GPU.
      - name: Build
        run: cargo build --release --features gpu-with-fallback --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p ncrs-${{ matrix.target }}
          cp target/${{ matrix.target }}/release/ncrs ncrs-${{ matrix.target }}/
          cp LICENSE README.md ROADMAP.md ncrs-${{ matrix.target }}/ 2>/dev/null || true
          tar -czf ncrs-${{ matrix.target }}.tar.gz -C . ncrs-${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path "ncrs-${{ matrix.target }}"
          Copy-Item "target/${{ matrix.target }}/release/ncrs.exe" "ncrs-${{ matrix.target }}/"
          Copy-Item LICENSE, README.md, ROADMAP.md "ncrs-${{ matrix.target }}/" -ErrorAction SilentlyContinue
          Compress-Archive -Path "ncrs-${{ matrix.target }}" -DestinationPath "ncrs-${{ matrix.target }}.zip"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ncrs-${{ matrix.target }}
          path: ncrs-${{ matrix.target }}.*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts

      - name: Collect archives
        run: |
          mkdir -p dist
          find artifacts -name "*.tar.gz" -o -name "*.zip" | while read -r f; do
            cp "$f" dist/
          done
          ls -la dist/

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@5113cdc90fd4d541c801c55356214017bf5ae34b # v3
        with:
          files: dist/*
          # Not a draft: `install.sh` resolves the binaries through
          # `releases/latest/download/`, which cannot see drafts. A drafted
          # release would leave the documented install command broken.
          draft: false
          # Also not a prerelease, and that is load-bearing rather than
          # cosmetic: `releases/latest` ignores prereleases, so a prereleased
          # v0.1.0 makes `releases/latest/download/<asset>` answer 404 and
          # silently breaks the install command the README documents. Once a
          # stable v1+ exists, a prerelease mark can come back — together with
          # the installer's fallback to a pinned URL, not before.
          prerelease: false
          generate_release_notes: true
