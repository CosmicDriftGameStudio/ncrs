name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# A new push to a pull request cancels the run before it. Runs on main are
# never cancelled: each push keeps its own result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: a push to a fork must not be able to touch the repository.
permissions:
  contents: read

jobs:
  # Decides which of the expensive jobs run. The release does not build: it
  # takes over what `targets` built on the push to main for the tagged commit.
  # So `targets` (and with it linux-packages and aur) always runs on main, and
  # on a pull request only when something that goes into the build or the
  # packages changed. `check` always runs; it is a required check.
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.filter.outputs.build }}
      homebrew: ${{ steps.filter.outputs.homebrew }}
      winget: ${{ steps.filter.outputs.winget }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then base=$PULL_REQUEST_BASE; else base=$PUSH_BEFORE; fi

          # No usable base (new branch, force push): count everything as changed.
          everything=false
          if [ -z "$base" ] || [ -z "${base//0/}" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            everything=true
            files=""
          else
            files=$(git diff --name-only "$base" HEAD)
          fi
          echo "$files"

          touched() { [ "$everything" = true ] || grep -Eq "$1" <<< "$files"; }
          emit() { if "${@:2}"; then echo "$1=true" >> "$GITHUB_OUTPUT"; else echo "$1=false" >> "$GITHUB_OUTPUT"; fi; }

          # Build and packaging inputs: manifests, build scripts, toolchain,
          # license policy, packaging files, assets, the workflows themselves.
          build_paths='^(Cargo\.toml|Cargo\.lock|about\.hbs|about\.toml|deny\.toml|rust-toolchain.*|\.cargo/|scripts/|packaging/|assets/|\.github/workflows/)|(^|/)(Cargo\.toml|build\.rs)$'
          homebrew_paths='^(packaging/homebrew/|scripts/homebrew-cask\.sh$|\.github/workflows/ci\.yml$)'
          winget_paths='^(packaging/winget/|packaging/windows/|scripts/winget-manifests\.sh$|scripts/fetch-komac\.sh$|\.github/workflows/ci\.yml$)'

          if [ "$EVENT" = push ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            emit build touched "$build_paths"
          fi
          emit homebrew touched "$homebrew_paths"
          emit winget touched "$winget_paths"

  # The release generates THIRD_PARTY_LICENSES.html from about.toml. A
  # dependency under a license about.toml does not accept would only fail
  # at the release tag; here it fails on the pull request that adds it. The
  # file also goes into the archives and packages `targets` lays out, and the
  # release signs it into the apps. Once is enough: about.toml covers all
  # release targets.
  licenses:
    name: Third-party licenses
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # Prebuilt binary, pinned so the licenses file does not change with a new
      # cargo-about version. The release binary has the CLI that
      # `cargo install` needs `--features cli` for.
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-about@0.9.2

      - name: Generate THIRD_PARTY_LICENSES.html
        run: cargo about generate about.hbs -o THIRD_PARTY_LICENSES.html

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: third-party-licenses
          path: THIRD_PARTY_LICENSES.html
          if-no-files-found: error
          # A release tagged days later takes this file from the push run.
          retention-days: ${{ github.event_name == 'push' && 90 || 1 }}

  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # Line tables are enough for backtraces and keep target/ (and the cache)
    # much smaller than full debug info. Set here and not workflow-wide: the
    # variables are part of the rust-cache key, and `targets` must keep the
    # key of the `targets` build.
    env:
      RUST_BACKTRACE: 1
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Linux only: the check reads Cargo.lock and the policy files, which do
      # not differ per operating system.
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        if: runner.os == 'Linux'
        with:
          tool: cargo-deny@0.20.2

      - name: Supply-chain audit
        if: runner.os == 'Linux'
        run: cargo deny check advisories licenses bans sources

      # The PDF tests load the pdfium library at runtime. The script checks the
      # download against a pinned checksum. The library sits in lib/ on macOS
      # and Linux and in bin/ on Windows. The path goes through GITHUB_WORKSPACE,
      # not PWD: under Git Bash on Windows PWD is a POSIX path (/d/a/...) that
      # the tests, which run from PowerShell, cannot open.
      - name: Fetch pdfium for the tests
        shell: bash
        run: |
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64) triple=x86_64-unknown-linux-gnu; lib=lib ;;
            macOS-ARM64) triple=aarch64-apple-darwin; lib=lib ;;
            Windows-X64) triple=x86_64-pc-windows-msvc; lib=bin ;;
            *) echo "::error::no pdfium binaries for ${{ runner.os }} ${{ runner.arch }}"; exit 1 ;;
          esac
          scripts/fetch-pdfium.sh "$triple" target/pdfium
          echo "NCRS_PDFIUM_DIR=$GITHUB_WORKSPACE/target/pdfium/$lib" >> "$GITHUB_ENV"

      # The OCR test needs the two text recognition models. The script checks
      # each download against a pinned size and checksum.
      - name: Fetch the text recognition models for the tests
        shell: bash
        run: |
          scripts/fetch-ocr-models.sh target/ocr-models
          echo "NCRS_OCR_MODELS_DIR=$GITHUB_WORKSPACE/target/ocr-models" >> "$GITHUB_ENV"

      # The tests of the built-in AI model need its file (640 MB). They run on
      # Linux only: the file would take 640 MB of cache per operating system,
      # llama.cpp still compiles everywhere with the default features, and on
      # the macOS runner the same three tests take about 15 minutes instead of
      # five. The cache key is the pinned checksum, so a new pin means a new
      # download; the script checks size and checksum on a hit as well. The
      # folder sits outside target/ because rust-cache prunes and saves that.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: runner.os == 'Linux'
        with:
          path: .ai-models
          key: ai-model-9465e63a22add5354d9bb4b99e90117043c7124007664907259bd16d043bb031

      - name: Fetch the AI model for the tests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash scripts/fetch-ai-model.sh .ai-models
          echo "NCRS_AI_MODELS_DIR=$GITHUB_WORKSPACE/.ai-models" >> "$GITHUB_ENV"

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The App Store build. Only macOS has the sandbox code to lint and run;
      # elsewhere the feature must still compile and change nothing.
      - name: Clippy, App Store build (macOS)
        if: runner.os == 'macOS'
        run: cargo clippy --workspace --all-targets --features sandbox -- -D warnings

      - name: Check, App Store feature (Linux, Windows)
        if: runner.os != 'macOS'
        run: cargo check --workspace --all-targets --features sandbox

      # Pixel comparisons are only meaningful where the reference images were
      # produced. Font rasterisation differs per operating system, so a
      # reference made on macOS does not match Windows output, and asserting it
      # there would be asserting nothing. The snapshot tests are therefore
      # skipped away from macOS; everything else runs everywhere.
      - name: Tests
        run: cargo test --workspace -- --skip ui_tests

      - name: Tests, App Store build (macOS)
        if: runner.os == 'macOS'
        run: cargo test -p ncrs -p ncrs-fs --features ncrs/sandbox -- --skip ui_tests

      # These tests are ignored above because they need the model file. The
      # log is checked for the count: a wrong filter or a missing feature would
      # run no test and still pass.
      - name: Tests with the local AI model
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -o pipefail
          cargo test -p ncrs-ai --features llama with_model_ -- --ignored 2>&1 | tee ai-tests.log
          grep -q 'test result: ok. 3 passed' ai-tests.log

      # The snapshot tests run only here, where the reference images in
      # tests/snapshots/ were produced. They are skipped above so a font
      # difference on another operating system cannot fail the build. They
      # render with tiny-skia whatever the build, see .cargo/config.toml.
      - name: Snapshot tests (macOS)
        if: runner.os == 'macOS'
        run: cargo test ui_tests

      # The backend differs per feature set, so the app has to build and its
      # tests have to pass in every configuration. This is not a formality: the
      # cfg logic in src/backend.rs only compiles in the ones the default build
      # does not exercise. The default is gpu-with-fallback, which the Tests
      # step above already covers.

      # The e2e tests render the real view headless, and a runner has no GPU.
      - name: Tests, GPU only
        run: cargo test --no-default-features --features gpu-rendering -- --skip ui_tests --skip e2e_tests

      - name: Tests, software only
        run: cargo test --no-default-features --features software-rendering -- --skip ui_tests

      # A build with no backend opens an empty window. iced only rejects that
      # in release mode, so CI has to be the one that catches it.
      - name: Tests, no backend must fail
        # Bash syntax, and the default shell on windows-latest is PowerShell.
        shell: bash
        run: |
          if cargo test --no-default-features backend::tests 2>/dev/null; then
            echo "::error::a build without a graphics backend must not pass its tests"
            exit 1
          fi
          echo "ok: the no-backend build fails its own test"

  # The release builds nothing: it signs and publishes what this job built on
  # the push to main for the tagged commit. ncrs-index compiles SQLCipher and
  # OpenSSL from C source for each of the five targets, so a missing compiler,
  # header or linker should fail on the pull request, not at the release tag.
  # The artifacts are laid out exactly as the release needs them; nothing is
  # signed or published here.
  #
  # Do not test release.yml itself with workflow_dispatch or a probe tag: that
  # publishes the assets again and breaks the Homebrew cask.
  targets:
    needs: [changes, licenses]
    if: needs.changes.outputs.build == 'true'
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The build image's glibc is the oldest one the binary runs on;
          # 24.04 keeps it at 2.39, `ubuntu-latest` would raise it.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: x86_64-apple-darwin
            # `macos-latest` is arm64; Intel has its own label.
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libfontconfig1-dev \
            cmake libclang-dev rpm

      # Only main saves.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: target-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # aarch64 Linux is cross-compiled on the x86_64 runner.
      - name: Add cross linker for aarch64 Linux
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          # bindgen (llama.cpp's bindings) finds the target's headers here.
          echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_unknown_linux_gnu=--sysroot=/usr/aarch64-linux-gnu" >> "$GITHUB_ENV"

      # ggml (llama.cpp) uses std::filesystem, which macOS has from 10.15.
      - name: Set the macOS deployment target
        if: runner.os == 'macOS'
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            aarch64-*) echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV" ;;
            *) echo "MACOSX_DEPLOYMENT_TARGET=10.15" >> "$GITHUB_ENV" ;;
          esac

      - name: Build
        run: cargo build --release --features gpu-with-fallback --target ${{ matrix.target }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: third-party-licenses

      # The library is the one the app loads at runtime, next to the binary.
      - name: Fetch pdfium
        shell: bash
        run: scripts/fetch-pdfium.sh ${{ matrix.target }} target/pdfium

      - name: Package
        shell: bash
        run: |
          binary=target/${{ matrix.target }}/release/ncrs
          if [ "${{ runner.os }}" = Windows ]; then binary="$binary.exe"; fi
          scripts/package.sh archive ${{ matrix.target }} "$binary" target/pdfium . \
            --licenses THIRD_PARTY_LICENSES.html

      # From the staged archive above, so the packages hold the very binary,
      # library and licenses of the tarball. They are named
      # ncrs-<target>.deb/.rpm, which the upload glob below picks up.
      - name: Package the .deb and .rpm
        if: runner.os == 'Linux'
        run: |
          scripts/fetch-nfpm.sh target/nfpm
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          scripts/package.sh linux-packages ${{ matrix.target }} \
            ncrs-${{ matrix.target }} "$version" . target/nfpm/nfpm

      - name: Package the macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          case "${{ matrix.target }}" in
            aarch64-*) min_macos=11.0 ;;
            *) min_macos=10.15 ;;
          esac
          scripts/package.sh app ncrs-${{ matrix.target }} "$version" "$min_macos" target/package-app

      # After Package, because it overwrites target/<target>/release/ncrs. A bare
      # file in its own artifact, so the release does not publish it: it packs
      # and signs it into the sandboxed app.
      - name: Build the sandboxed binary
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cargo build --release --features gpu-with-fallback,sandbox --target ${{ matrix.target }}
          mkdir -p sandbox-binary
          cp target/${{ matrix.target }}/release/ncrs sandbox-binary/ncrs

      # Ad hoc signature, because a pull request has no signing identity; the
      # release signs the same layout with the Developer ID.
      - name: Package the sandboxed macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          case "${{ matrix.target }}" in
            aarch64-*) min_macos=11.0 ;;
            *) min_macos=10.15 ;;
          esac
          scripts/package.sh sandbox-app ncrs-${{ matrix.target }} sandbox-binary/ncrs "$version" "$min_macos" target/package-sandbox-app
          app=target/package-sandbox-app/ncrs.app
          codesign --force --sign - "$app/Contents/Frameworks/libpdfium.dylib"
          codesign --force --sign - --options runtime --entitlements packaging/macos/sandbox.entitlements "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          scripts/package.sh check-sandbox "$app" sandboxed

      # A pull request has no profile and no identity, so a placeholder profile
      # and ad-hoc signatures; the release signs the same layout with Apple
      # Distribution.
      - name: Package the App Store app
        if: matrix.target == 'aarch64-apple-darwin'
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          printf 'placeholder provisioning profile\n' > target/placeholder.provisionprofile
          # Owner-only, like the profile the release decodes from its secret.
          chmod 600 target/placeholder.provisionprofile
          scripts/package.sh store-app ncrs-aarch64-apple-darwin sandbox-binary/ncrs "$version" target/placeholder.provisionprofile target/package-store-app
          app=target/package-store-app/ncrs.app
          codesign --force --sign - "$app/Contents/Frameworks/libpdfium.dylib"
          codesign --force --sign - --entitlements target/package-store-app/store.entitlements "$app"
          scripts/package.sh check-store "$app" target/placeholder.provisionprofile arm64
          productbuild --component "$app" /Applications target/package-store-app/ncrs.pkg
          rm -rf target/package-store-app/expanded
          pkgutil --expand-full target/package-store-app/ncrs.pkg target/package-store-app/expanded
          cmp target/placeholder.provisionprofile "$(find target/package-store-app/expanded -name embedded.provisionprofile | head -n 1)"

      # What the release signs and publishes, and what linux-packages and aur
      # install. The retention covers the time until a tag is cut on this commit.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ncrs-${{ matrix.target }}
          path: |
            ncrs-${{ matrix.target }}.*
            ncrs-${{ matrix.target }}-portable.zip
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 90 || 1 }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: runner.os == 'macOS'
        with:
          name: sandbox-binary-${{ matrix.target }}
          path: sandbox-binary/ncrs
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 90 || 1 }}

  # Installs the packages the targets job built on a clean Debian-family and a
  # clean Fedora image, each on its own CPU architecture, and starts the
  # binary. This is what catches a missing dependency or a wrong path, which
  # the build itself cannot.
  linux-packages:
    needs: targets
    name: install ${{ matrix.target }} on ${{ matrix.image }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
        image: ["ubuntu:24.04", "fedora:44"]
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # Native arm64, so the aarch64 package runs instead of being emulated.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - image: ubuntu:24.04
            extension: deb
            install: apt-get update -qq && apt-get install -y ./ncrs.deb desktop-file-utils
            validate: desktop-file-validate /usr/share/applications/ncrs.desktop
          - image: fedora:44
            extension: rpm
            install: dnf install -y ./ncrs.rpm
            # Fedora's desktop-file-utils is checked on the Ubuntu leg.
            validate: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: Cargo.toml
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ncrs-${{ matrix.target }}
          path: packages

      - name: Install and start
        env:
          PACKAGE: ncrs-${{ matrix.target }}.${{ matrix.extension }}
          INSTALL: ${{ matrix.install }}
          VALIDATE: ${{ matrix.validate }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          cp "packages/$PACKAGE" "packages/ncrs.${{ matrix.extension }}"
          # The binary resolves symlinks before it looks for libpdfium.so, so
          # the check follows /usr/bin/ncrs the same way.
          docker run --rm --volume "$PWD/packages:/packages:ro" --workdir /packages \
            --env INSTALL --env VALIDATE --env VERSION="$version" \
            "${{ matrix.image }}" bash -euc '
              export DEBIAN_FRONTEND=noninteractive
              eval "$INSTALL"
              ncrs --version | grep -F "ncrs $VERSION "
              test -f "$(dirname "$(readlink -f "$(command -v ncrs)")")/libpdfium.so"
              test -f /usr/share/applications/ncrs.desktop
              test -f /usr/share/icons/hicolor/256x256/apps/ncrs.png
              eval "$VALIDATE"
            '

  # Builds the signed apt and dnf repositories with throwaway keys from the
  # fresh packages and those of the previous release, and installs from them on
  # clean images: an install, then an upgrade to the fresh version. A wrong key
  # and a missing signature must each make the install fail, for that reason.
  # This is the test of the release job's repository step, which has no
  # container test of its own and needs no release here.
  package-repos:
    needs: targets
    name: signed apt and dnf repositories
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            Cargo.toml
            scripts
            packaging/linux
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: ncrs-*-linux-gnu
          merge-multiple: true
          path: artifacts

      - name: Previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          mkdir -p packages/current packages/previous
          cp artifacts/*.deb artifacts/*.rpm packages/current/
          # The newest published release that is not the version being built:
          # a re-run on a release commit has to find an older one.
          previous=""
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases \
            --limit 10 --json tagName --jq '.[].tagName'); do
            if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] && [ "${tag#v}" != "$version" ]; then
              previous="$tag"
              break
            fi
          done
          if [ -z "$previous" ]; then
            echo "::error::no release other than $version to upgrade from"
            exit 1
          fi
          gh release download "$previous" --repo "$GITHUB_REPOSITORY" \
            --pattern 'ncrs-*-unknown-linux-gnu.deb' --pattern 'ncrs-*-unknown-linux-gnu.rpm' \
            --dir packages/previous
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "PREVIOUS_VERSION=${previous#v}" >> "$GITHUB_ENV"

      - name: Install the tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends apt-utils createrepo-c rpm

      - name: Build the repositories and install from them
        run: scripts/check-package-repos.sh "$RUNNER_TEMP/package-repos" packages "$VERSION" "$PREVIOUS_VERSION"

  # Builds the AUR package (packaging/aur) with makepkg from the archive the
  # targets job made and installs it on a clean Arch image. Only x86_64: the
  # image has no aarch64 variant, but the aarch64 checksum is rendered too.
  aur:
    needs: targets
    name: AUR package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: ncrs-*-linux-gnu
          merge-multiple: true
          path: packages

      - name: Render the package files
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          sha256_x86_64=$(sha256sum packages/ncrs-x86_64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)
          sha256_aarch64=$(sha256sum packages/ncrs-aarch64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)
          scripts/aur-package.sh "$version" "$sha256_x86_64" "$sha256_aarch64" aur
          # With the archive next to the PKGBUILD makepkg verifies the checksum
          # against this file instead of downloading the release.
          cp packages/ncrs-x86_64-unknown-linux-gnu.tar.gz "aur/ncrs-$version-x86_64.tar.gz"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build, install and start
        run: |
          docker run --rm --volume "$PWD/aur:/aur:ro" --env VERSION \
            archlinux:base-devel bash -euc '
              pacman -Syu --noconfirm
              pacman -S --noconfirm --needed $(. /aur/PKGBUILD; echo "${depends[@]}")
              useradd --create-home builder
              cp -a /aur /home/builder/pkg
              chown -R builder /home/builder/pkg
              su builder -c "cd ~/pkg && makepkg --printsrcinfo | diff -u .SRCINFO - && makepkg --noconfirm"
              pacman -U --noconfirm /home/builder/pkg/ncrs-bin-*.pkg.tar.*
              ncrs --version | grep -F "ncrs $VERSION "
              test -f "$(dirname "$(readlink -f "$(command -v ncrs)")")/libpdfium.so"
              test -f /usr/share/applications/ncrs.desktop
              test -f /usr/share/icons/hicolor/256x256/apps/ncrs.png
              test -f /usr/share/licenses/ncrs-bin/LICENSE
            '

  # Renders the Homebrew cask (packaging/homebrew) with dummy values and checks
  # that it parses and carries them, so a broken template fails here and not
  # in the tap after a release.
  homebrew:
    needs: changes
    if: needs.changes.outputs.homebrew == 'true'
    name: Homebrew cask
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Render and check the cask
        run: |
          set -euo pipefail
          sha256_arm=$(printf '1%.0s' $(seq 64))
          sha256_intel=$(printf '2%.0s' $(seq 64))
          scripts/homebrew-cask.sh 1.2.3 "$sha256_arm" "$sha256_intel" homebrew
          ruby -c homebrew/ncrs.rb
          grep -Fq 'version "1.2.3"' homebrew/ncrs.rb
          grep -Fq "arm:   \"$sha256_arm\"" homebrew/ncrs.rb
          grep -Fq "intel: \"$sha256_intel\"" homebrew/ncrs.rb
          if grep -Fq '@' homebrew/ncrs.rb; then
            echo "::error::a placeholder is left in the cask"
            exit 1
          fi

  # Installs the winget manifests (packaging/winget) with winget itself and
  # starts what it installed. It tests the manifests against the latest
  # published release, not against the build of this pull request: winget
  # installs a zip from a URL, so there is nothing of the PR to install.
  winget:
    needs: changes
    if: needs.changes.outputs.winget == 'true'
    name: winget install
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Render the manifests for the latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          asset=ncrs-x86_64-pc-windows-msvc.zip
          mkdir release
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir release
          sha256=$(sha256sum "release/$asset" | cut -d' ' -f1)
          scripts/winget-manifests.sh "${tag#v}" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$asset" \
            "$sha256" winget-manifests
          echo "RELEASE_VERSION=${tag#v}" >> "$GITHUB_ENV"

      # The windows-latest image does not list winget, and Windows Server has
      # no App Installer to begin with. The module installs it on demand.
      - name: Make sure winget exists
        shell: pwsh
        run: |
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
            Install-PackageProvider -Name NuGet -Force | Out-Null
            Install-Module -Name Microsoft.WinGet.Client -Force -Repository PSGallery
            Repair-WinGetPackageManager -AllUsers -Latest
            $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          }
          # An installed winget can still be unusable on a fresh image.
          winget --version

      - name: Install through winget
        shell: pwsh
        run: |
          winget settings --enable LocalManifestFiles
          winget validate --manifest winget-manifests
          if ($LASTEXITCODE -ne 0) { throw 'winget validate failed' }
          winget install --manifest winget-manifests --accept-package-agreements --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) { throw 'winget install failed' }

      - name: Start the installed ncrs
        shell: pwsh
        run: |
          # winget puts its Links folder on the user PATH, which this step
          # does not see yet.
          $links = Join-Path $env:LOCALAPPDATA 'Microsoft\WinGet\Links'
          $env:Path = "$links;" + $env:Path
          $link = Join-Path $links 'ncrs.exe'
          if (-not (Test-Path $link)) { throw "no $link after the install" }

          # Out-String: the binary may not be attached to a console, and then
          # nothing reaches the pipeline otherwise.
          $version = (& $link --version | Out-String)
          if ($version -notlike "ncrs $env:RELEASE_VERSION *") {
            throw "unexpected --version output: $version"
          }

          # The link is what winget starts; pdfium is looked up next to the
          # real executable behind it.
          $item = Get-Item $link
          if (-not $item.LinkTarget) { throw "$link is not a link" }
          # winget writes an absolute target; GetFullPath keeps it and would
          # also resolve a relative one against the Links folder.
          $target = [System.IO.Path]::GetFullPath(($item.LinkTarget | Select-Object -First 1), (Split-Path $link))
          $folder = Split-Path $target
          if (-not (Test-Path (Join-Path $folder 'pdfium.dll'))) { throw "no pdfium.dll next to $target" }
          # A data folder would make ncrs portable, and winget would delete it
          # on the next upgrade.
          if (Test-Path (Join-Path $folder 'data')) { throw "unexpected data folder next to $target" }
