name: Advisories

# A new advisory has to show up even in a week without a push, and CI only
# checks on push and pull request. Only advisories: licenses, bans and sources
# do not change unless Cargo.lock does.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    name: Advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install --profile minimal

      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-deny@0.20.2

      - name: Check advisories
        run: cargo deny check advisories
