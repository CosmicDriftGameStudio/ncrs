name: AI model

# The tests that run the built-in model (Qwen3 4B) on a CPU runner take 20 to 30
# minutes. They live apart from ci.yml so that they block neither a pull
# request nor the release: release.yml waits for the ci.yml run on main only.
# A red run here is a signal to look at, not a gate.
on:
  pull_request:
    paths:
      - crates/ncrs-ai/**
      - crates/ncrs-index/**
      - crates/ncrs-intake/**
      - scripts/fetch-ai-model.sh
      - Cargo.lock
      - Cargo.toml
      - rust-toolchain*
      - .cargo/**
      - .github/workflows/ai-model.yml
  push:
    branches: [main]
    paths:
      - crates/ncrs-ai/**
      - crates/ncrs-index/**
      - crates/ncrs-intake/**
      - scripts/fetch-ai-model.sh
      - Cargo.lock
      - Cargo.toml
      - rust-toolchain*
      - .cargo/**
      - .github/workflows/ai-model.yml
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ai-model-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The 174 sentences of the chat evaluation run one after the other, about 25
  # minutes on a CPU. Each shard takes every fourth sentence; the thresholds
  # apply to the sum of the shards (chat-eval-result), not to a single shard.
  chat-eval:
    name: chat evaluation, shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      RUST_BACKTRACE: 1
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      NCRS_EVAL_SHARD: ${{ matrix.shard }}/4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install the Vulkan build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev glslc spirv-headers

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: ai-model
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # llama-cpp-sys-2 hard-links its `lib*.so` symlinks into target/debug and
      # deps, where they dangle. A later build of it in the same target folder
      # sees them as missing and fails on hard_link with AlreadyExists.
      - name: Remove dangling llama.cpp links
        run: '[ ! -d target/debug ] || find target/debug -maxdepth 2 -name "lib*.so*" -xtype l -delete'

      # The cache key is the pinned checksum of the model, so a new pin means a
      # new download; the script checks size and checksum on a hit as well. The
      # folder sits outside target/ because rust-cache prunes and saves that.
      # The `targets` job of ci.yml restores this cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ai-models
          key: ai-model-7485fe6f11af29433bc51cab58009521f205840f5b4ae3a32fa7f92e8534fdf5

      - name: Fetch the AI model
        run: |
          bash scripts/fetch-ai-model.sh .ai-models
          echo "NCRS_AI_MODELS_DIR=$GITHUB_WORKSPACE/.ai-models" >> "$GITHUB_ENV"

      # --show-output puts the time of every sentence and the compute (GPU or
      # CPU) into the log.
      - name: Chat evaluation
        run: |
          set -o pipefail
          cargo test -p ncrs-ai --features llama with_model_chat_eval -- --ignored --show-output 2>&1 | tee chat-eval.log

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: chat-eval-shard-${{ matrix.shard }}
          path: chat-eval.log
          if-no-files-found: error
          retention-days: 7

  chat-eval-result:
    name: chat evaluation, result
    needs: chat-eval
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: chat-eval-shard-*
          path: shards

      # Same integer arithmetic and thresholds as the test
      # (crates/ncrs-ai/src/chat/live.rs).
      - name: Sum the shards and check the thresholds
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          lines=$(grep -h '^chat eval shard ' shards/*/chat-eval.log || true)
          echo "$lines"
          shard_count=$(grep -c . <<< "$lines" || true)
          if [ "$shard_count" -ne 4 ]; then
            echo "::error::expected the result line of 4 shards, found $shard_count"
            exit 1
          fi
          # chat eval shard <i>/<n>: total <T> sentences <S> intent <X> full <Y>
          totals=$(awk '{ print $6 }' <<< "$lines" | sort -u)
          if [ "$(wc -l <<< "$totals")" -ne 1 ]; then
            echo "::error::the shards disagree on the number of sentences: $totals"
            exit 1
          fi
          indexes=$(sed -E 's#^chat eval shard ([0-9]+)/([0-9]+):.*#\1/\2#' <<< "$lines" | sort | tr '\n' ' ')
          if [ "$indexes" != "0/4 1/4 2/4 3/4 " ]; then
            echo "::error::unexpected shards: $indexes"
            exit 1
          fi
          read -r sentences intent full < <(awk '{ s += $8; i += $10; f += $12 } END { print s, i, f }' <<< "$lines")
          if [ "$sentences" -ne "$totals" ]; then
            echo "::error::the shards ran $sentences of $totals sentences"
            exit 1
          fi
          {
            echo "### Chat evaluation"
            echo
            echo "| | hits | of | threshold |"
            echo "|---|---|---|---|"
            echo "| intent | $intent | $sentences | 92 % |"
            echo "| full | $full | $sentences | 85 % |"
          } >> "$GITHUB_STEP_SUMMARY"
          status=0
          if [ $((intent * 100)) -lt $((sentences * 92)) ]; then
            echo "::error::intent $intent/$sentences is under 92 %"
            status=1
          fi
          if [ $((full * 100)) -lt $((sentences * 85)) ]; then
            echo "::error::full $full/$sentences is under 85 %"
            status=1
          fi
          exit $status

  # The tests apart from the chat evaluation.
  model-tests:
    name: tests with the local AI model
    runs-on: ubuntu-latest
    env:
      RUST_BACKTRACE: 1
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install the Vulkan build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev glslc spirv-headers

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: ai-model
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Remove dangling llama.cpp links
        run: '[ ! -d target/debug ] || find target/debug -maxdepth 2 -name "lib*.so*" -xtype l -delete'

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ai-models
          key: ai-model-7485fe6f11af29433bc51cab58009521f205840f5b4ae3a32fa7f92e8534fdf5

      - name: Fetch the AI model
        run: |
          bash scripts/fetch-ai-model.sh .ai-models
          echo "NCRS_AI_MODELS_DIR=$GITHUB_WORKSPACE/.ai-models" >> "$GITHUB_ENV"

      # The count is checked in the source and in the log: a wrong filter or a
      # missing feature would run no test and still pass. Six `with_model_`
      # tests, one of them the chat evaluation.
      - name: Tests with the local AI model
        run: |
          set -o pipefail
          [ "$(grep -rhoE 'fn with_model_[a-z0-9_]+' crates/ncrs-ai/src | wc -l)" -eq 6 ]
          [ "$(grep -rhoE 'fn with_model_chat_eval[a-z0-9_]*' crates/ncrs-ai/src | wc -l)" -eq 1 ]
          cargo test -p ncrs-ai --features llama with_model_ -- --ignored --show-output --skip chat_eval 2>&1 | tee ai-tests.log
          grep -q 'test result: ok. 5 passed' ai-tests.log

  # Only on main, the schedule and by hand: a pull request would wait another
  # 22 minutes for it, and the Linux shards already check the evaluation. It
  # runs the whole evaluation in one go, with the thresholds, to see the speed
  # on Windows.
  windows-chat-eval:
    name: chat evaluation (Windows)
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    env:
      RUST_BACKTRACE: 1
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install the Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@6d320c543af48e7e45b02c8c9ab14d5ffad48eba # v1.8.0
        with:
          install_runtime: false
          cache: true
          stripdown: true

      # The Visual Studio generator fails on the vulkan-shaders-gen
      # ExternalProject of ggml; Ninja in the MSVC environment does not. The
      # default shell (pwsh) stays for cargo: the vendored OpenSSL needs it.
      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Ninja
        uses: seanmiddleditch/gha-setup-ninja@3b1f8f94a2f8254bd26914c4ab9474d4f0015f67 # v6

      - name: Use Ninja for CMake
        shell: bash
        run: echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: ai-model-windows
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Windows does not cache the model: the cache budget of the repository
      # cannot hold 2.5 GB per operating system.
      - name: Fetch the AI model
        shell: bash
        run: |
          bash scripts/fetch-ai-model.sh .ai-models
          echo "NCRS_AI_MODELS_DIR=$GITHUB_WORKSPACE/.ai-models" >> "$GITHUB_ENV"

      # No time limit fails the test; the log shows the times.
      - name: Chat evaluation with the local AI model
        run: |
          # cargo writes its progress to stderr; the exit code decides below.
          $ErrorActionPreference = 'Continue'
          cargo test -p ncrs-ai --features llama with_model_chat_eval -- --ignored --show-output 2>&1 | Tee-Object -FilePath ai-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path ai-tests.log -Pattern 'chat eval:' -Quiet)) { exit 1 }
