name: Set up the local AI model build
description: Rust, the Vulkan build dependencies, the build cache and the pinned model for the ai-model jobs. Run after the checkout.

runs:
  using: composite
  steps:
    - name: Install Rust
      shell: bash
      run: |
        rustup toolchain install stable --profile minimal
        rustup default stable

    - name: Install the Vulkan build dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libvulkan-dev glslc spirv-headers

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      with:
        shared-key: ai-model
        save-if: ${{ github.ref == 'refs/heads/main' }}

    # llama-cpp-sys-2 hard-links its `lib*.so` symlinks into target/debug and
    # deps, where they dangle. A later build of it in the same target folder
    # sees them as missing and fails on hard_link with AlreadyExists.
    - name: Remove dangling llama.cpp links
      shell: bash
      run: '[ ! -d target/debug ] || find target/debug -maxdepth 2 -name "lib*.so*" -xtype l -delete'

    # The cache key is the pinned checksum of the model, read from the fetch
    # script, so a new pin means a new download; the script checks size and
    # checksum on a hit as well. The folder sits outside target/ because
    # rust-cache prunes and saves that. The `targets` job of ci.yml restores
    # this cache.
    - name: Read the model pin
      id: pin
      shell: bash
      run: echo "sha=$(sed -n 's/^SHA256="\(.*\)"$/\1/p' scripts/fetch-ai-model.sh)" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .ai-models
        key: ai-model-${{ steps.pin.outputs.sha }}

    - name: Fetch the AI model
      shell: bash
      run: |
        bash scripts/fetch-ai-model.sh .ai-models
        echo "NCRS_AI_MODELS_DIR=$GITHUB_WORKSPACE/.ai-models" >> "$GITHUB_ENV"
