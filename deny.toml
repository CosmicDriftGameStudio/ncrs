# cargo-deny configuration.
#
# The point is the license check: this project distributes under MIT, so every
# dependency has to be permissive. A blanket allowance for the licenses below
# would be a check that can never fail, so the two exceptions that exist are
# named per crate and carry the reason.
#
# This replaced a prose audit in ROADMAP.md, which had looked at 166 crates
# and was never run by anything. A check nobody runs is not a check.
#
# Run locally: cargo install cargo-deny && cargo deny check

[graph]
# All release targets, not just the host: a Windows-only crate is invisible to
# `cargo tree` on Linux, and that is how clipboard-win and error-code got past
# the original audit.
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
]
# `drag` is a macOS and Windows dependency only, but cargo-deny filters each
# edge on its own, so drag's Linux edge to GTK counts although no build takes
# it (`cargo tree --target x86_64-unknown-linux-gnu` has no gtk). Without this,
# glib-macros brings an unmaintained-crate advisory for code nobody compiles.
exclude = ["gtk", "gdk", "gdkx11"]

[advisories]
version = 2
yanked = "deny"

# RUSTSEC-2026-0192: ttf-parser is unmaintained and the author has said no
# further fixes will come. It arrives transitively through cosmic-text ->
# fontdb, and cosmic-text is how iced lays out text, so there is no version of
# iced that avoids it and no upgrade that fixes it.
#
# Not blocked, because the alternative is a project that cannot be built at
# all — but recorded here so it is a decision rather than an oversight, and
# re-checked whenever the lockfile moves. The practical exposure is small: it
# parses font outlines, we only use it to measure text, and no untrusted input
# reaches it. If ied ever ships a version that drops cosmic-text, this goes.
#
# RUSTSEC-2026-0370, -0371, -0372: zvariant, zbus_names and zvariant_derive
# are no longer released on their own; they were merged into zbus 6. They
# arrive through keyring -> secret-service -> zbus 5, the Linux Secret Service
# backend that holds the index key. Nothing is known to be wrong with them,
# and there is no upgrade until secret-service moves to zbus 6. They only
# speak D-Bus with the local session bus. When keyring ships a zbus 6 backend,
# these go.
#
# RUSTSEC-2024-0436: paste is unmaintained; its author archived it. It arrives
# through wgpu-hal -> metal, the macOS GPU backend of the default
# gpu-with-fallback build. It is a proc macro that only concatenates
# identifiers at compile time, so none of its code ends up in the binary or
# sees any input. When metal or wgpu-hal drop it, this goes.
#
# RUSTSEC-2026-0206: rustybuzz is unmaintained. It arrives through iced's svg
# feature: iced_tiny_skia -> resvg (default features) -> usvg, which uses it to
# shape <text> elements. iced turns those defaults on, so no feature switch
# avoids it. The only SVGs ncrs draws are the icons compiled into the binary
# from assets/icons, and none of them contains text. When usvg moves to
# harfrust, this goes.
ignore = [
    "RUSTSEC-2024-0436",
    "RUSTSEC-2026-0192",
    "RUSTSEC-2026-0206",
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
]

[licenses]
version = 2
# GPL, LGPL and AGPL are banned, with no per-crate exception either: the Mac
# App Store adds usage rules to every app it sells, and the GPL family forbids
# adding restrictions, so one such crate would keep ncrs out of the store.
# cargo-deny's license check (version 2) has no deny list; whatever `allow` and
# `exceptions` do not name fails. Leaving the GPL family out is therefore the
# ban, and tests/license_policy.rs fails if it is ever added here or to
# about.toml.
#
# A crate offered under a choice passes on its permissive branch: r-efi
# ("MIT OR Apache-2.0 OR LGPL-2.1-or-later") and self_cell
# ("Apache-2.0 OR GPL-2.0-only") are used under MIT and Apache-2.0.
#
# Permissive only. BSL-1.0 is deliberately absent: it is OSI-listed and
# MIT-compatible, but it carries a naming condition for resale, and allowing it
# for the whole tree would hide any future crate that arrives with it.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "Unicode-3.0",
    "MPL-2.0",
]
confidence-threshold = 0.93

# Per-crate exceptions, so BSL-1.0 is accepted for these two and nothing else.
# Both are transitive and Windows-only, so they do not appear in a
# `cargo tree` on Linux or macOS — which is exactly how the first audit, run
# with `cargo metadata` on one platform, missed them.
#
# Both are single-purpose and each has a maintained replacement:
#   clipboard-win -> arboard,  error-code -> windows-sys
# Swapping them is worth doing; it is not worth blocking the build until it is
# done, and pretending the check does not exist is worse.
exceptions = [
    { allow = ["BSL-1.0"], crate = "clipboard-win" },
    { allow = ["BSL-1.0"], crate = "error-code" },
    # The Mozilla root certificates the theme download trusts. The license
    # covers data, not code, and asks only that its text travels with it.
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
    # The SQLCipher sources of the encrypted index (a build dependency of
    # libsqlite3-sys). blessing is SQLite's public-domain dedication, which the
    # bundled SQLite always carried. WTFPL covers libtomcrypt, which ships in
    # the crate but is not compiled: bundled-sqlcipher-vendored-openssl builds
    # SQLCipher against the vendored OpenSSL.
    { allow = ["blessing", "WTFPL"], crate = "sqlcipher-src" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
