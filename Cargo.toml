[workspace]
members = ["crates/*"]
# vendor/winit is a patched dependency, not a workspace crate: no workspace lints,
# no clippy or fmt run over it.
exclude = ["vendor"]
resolver = "2"

[package]
name = "ncrs"
version = "1.1.1"
edition = "2021"
# Matches rust-toolchain.toml. One place decides the compiler; this makes the
# requirement visible to anything reading the manifest instead of the file.
rust-version = "1.98"
description = "A dual-panel file manager inspired by Norton Commander, built with iced"
license = "MIT"

[lints]
workspace = true

[dependencies]
# x11 and wayland are not optional in practice: iced_tiny_skia depends on
# softbuffer, whose backend enum is generated from #[cfg] arms. Without these
# features no arm applies on Linux, and the generated enum keeps type
# parameters that nothing uses — E0392, and the build fails.
#
# They are ignored on macOS and Windows, where the softbuffer backends are
# cfg'd out anyway, so enabling them costs nothing there.
# "svg" draws the status and folder icons of the Hermes column (assets/icons).
# "advanced" is what re-exports iced's `Program` trait. It is the trait the
# end-to-end tests drive the app through, so without it `tests/` could not use
# the real `main` wiring and would have to duplicate it.
# "image-without-codecs" is the image widget and handle of the document preview;
# the preview decodes the files itself (see `image` below).
iced = { version = "0.14", default-features = false, features = ["tokio", "fira-sans", "x11", "wayland", "advanced", "svg", "image-without-codecs"] }
# Only what the code uses: spawn_blocking, #[tokio::test], the multi-thread
# runtime iced's executor needs and, for the SFTP connection, TCP ("net", which
# russh switches on as well). "full" also pulls signal-hook-registry and wasi,
# machinery a file manager has no use for.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# toml_edit rather than toml: the config file will be written back (keymap,
# theme, language picked in the UI), and only toml_edit keeps the user's
# comments and layout when it does. "parse" and "serde" read it, "display"
# writes it back (the locations the filing setup picks).
toml_edit = { version = "0.25", default-features = false, features = ["parse", "serde", "display"] }
# derive is the config schema: the structs in config.rs are read straight from it.
serde = { version = "1", features = ["derive"] }
# Spanned: a config error names the line of the key that is wrong, and the
# keymap only learns that after parsing. toml_edit does not re-export it.
serde_spanned = { version = "1.1", features = ["serde"] }
# The crates behind ripgrep, so walking, patterns and content search behave the
# same on all three systems. unicode-normalization is there because macOS hands
# out file names decomposed (NFD) while patterns are typed composed (NFC).
ignore = "0.4.33"
globset = "0.4.20"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
grep-matcher = "0.1.9"
unicode-normalization = "0.1.26"
nucleo-matcher = "0.3.1"
ncrs-intake = { path = "crates/ncrs-intake", version = "0.0.0" }
# The filing module opens the index and holds its key in the credential store.
ncrs-index = { path = "crates/ncrs-index", version = "0.0.0" }
# Plain data types several features share: file entries and selections.
ncrs-core = { path = "crates/ncrs-core", version = "0.0.0" }
# The search: engine, filters, view state and messages.
ncrs-search = { path = "crates/ncrs-search", version = "0.0.0" }
# Translated UI strings, generated from strings.json.
ncrs-i18n = { path = "crates/ncrs-i18n", version = "0.0.0" }
# Colors, sizes and widgets the screens are built from, generic over the message type.
ncrs-ui-kit = { path = "crates/ncrs-ui-kit", version = "0.0.0" }
# Runs the processing steps on a pool of worker threads whose size follows the load setting.
ncrs-pipeline = { path = "crates/ncrs-pipeline", version = "0.0.0" }
# Asks a provider for the fields the rules left open, including the built-in model.
ncrs-ai = { path = "crates/ncrs-ai", version = "0.0.0" }
# Folders that overlap are found by file identity, which holds for symlinks and
# case-insensitive file systems where comparing paths would not.
same-file = "1.0"
# The config written back by the filing setup goes to a temporary file in the
# same folder first and is then renamed over the old one.
tempfile = "3.27"
# The system folder dialog of the filing setup. No default features: xdg-portal
# talks to the desktop portal through libdbus loaded at runtime (zenity as its
# own fallback), so Linux needs neither GTK nor an async runtime. "wayland" only
# serves a parent window, and the dialog is opened without one.
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal"] }
# Reads the VS Code theme files named by `vscode` in `[theme]`: JSON with
# comments and trailing commas. No features, so no dependencies.
jsonc-parser = { version = "=0.34.0", default-features = false }
# Downloads a VS Code color theme from Open VSX, only when the user asks for it
# in the command palette. Blocking and HTTPS only (rustls), run off the UI thread.
ureq = { version = "=3.5.0", default-features = false, features = ["rustls"] }
# Reads the downloaded .vsix in memory to pick the theme files out of it. Entries
# are read by name with a size limit and never extracted to disk.
zip = { version = "=9.1.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Browsing archives like folders. Entries are unpacked by our own code, never
# with tar's `unpack`, so one name rule covers every format; no default features
# keeps the xattr dependency out.
tar = { version = "0.4.46", default-features = false }
# The same zlib-rs backend zip already uses, for .tar.gz.
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
# .tar.zst. No default features: no legacy format support, no zdict builder.
zstd = { version = "0.14.3", default-features = false }
# .7z. Pure Rust and Apache-2.0, unlike 7-Zip and libarchive (LGPL).
# LZMA, LZMA2 and the BCJ filters are always on; `deflate` reuses the zlib-rs
# backend above. `compress` is the LZMA2 encoder for writing. No `aes256`: an
# encrypted archive is refused, not decrypted.
sevenz-rust2 = { version = "0.24.1", default-features = false, features = ["compress", "deflate"] }
# The real home folder and the bookmarks that keep a folder grant in the App
# Sandbox. Only the `sandbox` feature (the App Store build) brings it in.
ncrs-sandbox = { path = "crates/ncrs-sandbox", version = "0.0.0", optional = true }
# SFTP, password login only. ring as crypto backend (the default aws-lc-rs would
# add a second C library), no `rsa` feature: the rsa crate behind it has an open
# advisory (RUSTSEC-2023-0071), so servers that offer only RSA host keys are not
# supported yet. Both are pinned, and russh pins ssh-key to a release candidate
# that must match.
russh = { version = "=0.65.0", default-features = false, features = ["ring"] }
russh-sftp = "=3.0.1"
# The login passwords of saved servers, one keychain entry per server; the same
# crate and version as the index key in ncrs-index.
keyring = "4.2"
# Host names in known_hosts files can be hashed (`|1|salt|hash`, HMAC-SHA1).
hmac = "0.13"
sha1 = "0.11"
data-encoding = "2"
# A typed password is wiped from memory when it is dropped.
zeroize = "1"
# Cmd+V / Ctrl+V pastes files, an image or text from the system clipboard, and
# "Copy files to the clipboard" puts a file list on it. "image-data" reads and
# writes the picture; no other defaults.
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
# Encodes a pasted picture as PNG. Already in the tree through arboard's image
# dependency and iced.
png = "0.18"
# The document preview decodes pictures itself, with limits on size and memory,
# and scales them down before iced sees them. Only the formats the file types
# of the intake name (HEIC stays unsupported).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# Without the data-control protocol the clipboard cannot be read or written on
# a Wayland desktop that has no X11 clipboard (Cargo adds this to the feature
# set above).
arboard = { version = "3.6", default-features = false, features = ["image-data", "wayland-data-control"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
# The trash on Windows and Linux. macOS talks to NSFileManager itself, because
# the crate cannot list or restore there.
trash = "5.2.9"

[target.'cfg(target_os = "macos")'.dependencies]
# The native menu bar on macOS, built from the command list. macOS only: Linux
# would need GTK, and on Windows installing the menu takes an unsafe call that
# the app crate forbids. No features, so no GTK and no xdo.
muda = { version = "=0.21.2", default-features = false }
# The name of the person using the app, for the sender check of the AI, and
# moving entries to the trash and back.
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSPathUtilities", "NSFileManager", "NSURL", "NSError"] }
# Apple Vision as the first choice for reading scans; ocrs stays the fallback.
ncrs-ocr-vision = { path = "crates/ncrs-ocr-vision", version = "0.0.0" }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
# Starts the system drag of files out of the window, into the Finder, Explorer
# or a browser upload. Not on Linux, where it needs GTK.
drag = { version = "=2.1.1", default-features = false }

# winit 0.30 references the private CGS API (see vendor/winit/NCRS-PATCH.md).
[patch.crates-io]
winit = { path = "vendor/winit" }

# Line tables are enough for backtraces; full debug info makes every link slower.
# Dependencies are optimised because the snapshot tests render with tiny-skia,
# which is many times slower unoptimised; they are built once and then cached.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[features]
# The fallback build, as in releases: software rendering is unusably slow on a
# high-resolution display, and tiny-skia still takes over where there is no GPU.
default = ["gpu-with-fallback", "local-ai"]

# The built-in model provider: llama.cpp is compiled into the app. Needs cmake
# and a C++ compiler at build time; leave it out with --no-default-features.
local-ai = ["ncrs-ai/llama"]

# The macOS App Store build: inside the App Sandbox the home folder, the folder
# grants, the keychain entry and the trash work differently. Off by default, and
# without the feature nothing of it is compiled in. On other systems the feature
# builds but changes nothing, since only macOS has the sandbox.
sandbox = ["dep:ncrs-sandbox"]

# Software rasterisation only: no GPU or driver needed, works on CI runners and
# VMs, but slow on high-resolution displays.
software-rendering = ["iced/tiny-skia"]

# GPU rendering. Faster to draw, needs Vulkan/Metal/DX11 at runtime.
gpu-rendering = ["iced/wgpu"]

# Both: wgpu is tried first, tiny-skia takes over where there is no GPU.
gpu-with-fallback = ["iced/wgpu", "iced/tiny-skia"]

[dev-dependencies]
# iced's own UI testing: Simulator (headless), Emulator (end-to-end),
# snapshot images, and Ice scripts.
iced_test = "0.14"
iced_selector = "0.14"
# A one-page PDF for the tests of the document preview.
ncrs-intake = { path = "crates/ncrs-intake", version = "0.0.0", features = ["test-support"] }
# The checksum of the bytes a test server hands out for the AI model download.
sha2 = "0.10"
# Hits for the snapshot tests of the search filters.
ncrs-search = { path = "crates/ncrs-search", version = "0.0.0", features = ["test-support"] }
# Writes the 7z archives the tests read; the release build only decodes.
sevenz-rust2 = { version = "0.24.1", default-features = false, features = ["compress", "deflate"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
# The clipboard tests read the pasteboard the way the Finder does and give the
# developer's clipboard back afterwards; arboard can do neither. All three are
# in the tree through arboard already.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSString", "NSURL"] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
# The clipboard tests read and write CF_HDROP the way Explorer does, beside
# arboard. In the tree through arboard already.
clipboard-win = "5.4"

# crates/ncrs-ocr-vision/Cargo.toml and crates/ncrs-sandbox/Cargo.toml repeat
# these tables with unsafe_code = "deny"; change all three together.
[workspace.lints.rust]
# A file manager must never execute unchecked code: the whole point is to touch
# the filesystem, and the unsafe surface there is not worth the review.
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# This list applies to every crate in the workspace; comments that name a file
# (build.rs, layout.rs, the test fixtures) describe the ncrs package.
# `unwrap_used`, `expect_used` and `panic` are clippy restriction lints. They
# cannot be switched on one by one: naming them below without the group on top
# does nothing at all, silently. Enabling the group brings ~1000 further
# warnings, so the unwanted members are named "allow" after it.
#
# Verified by putting an `expect` into production code: silent without the group,
# reported with it. The `#![allow]` on each `mod tests` keeps the test tree out
# of the count, since a failing assertion there *is* the signal.
restriction = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"

# The rest of the group, off again. Each was in the warning list after enabling
# it; the names are taken from clippy's own output, not guessed.
absolute_paths = "allow"
allow_attributes = "allow"
allow_attributes_without_reason = "allow"
arbitrary_source_item_ordering = "allow"
arithmetic_side_effects = "allow"
as_conversions = "allow"
blanket_clippy_restriction_lints = "allow"
create_dir = "allow"
else_if_without_else = "allow"
implicit_return = "allow"
min_ident_chars = "allow"
missing_inline_in_public_items = "allow"
mod_module_files = "allow"
needless_pass_by_value = "allow"
pattern_type_mismatch = "allow"
question_mark_used = "allow"
single_call_fn = "allow"
single_char_lifetime_names = "allow"
std_instead_of_core = "allow"
string_add = "allow"
string_add_assign = "allow"
string_lit_as_bytes = "allow"
todo = "allow"
unnecessary_debug_formatting = "allow"
unnecessary_literal_unwrap = "allow"
unnecessary_result_map_or_else = "allow"
# Documentation is wanted where it explains a decision, not everywhere. This
# asks for a doc comment on every private field and every enum variant, which
# is 224 warnings of noise in a codebase whose comments already explain the
# "why".
missing_docs_in_private_items = "allow"

# The parser in build.rs indexes strings by byte index. Two of the remaining
# warnings point at that and are fixed in code, not silenced here.

# `println!` in build.rs reports what it generated; in tests it is the output of
# the translation dump. A binary that logs to stdout in production would be a
# bug, and CI is the place to catch that, not a lint here.
print_stderr = "allow"
print_stdout = "allow"

# Style and taste, decided rather than defaulted into. Each of these was in the
# list after enabling the group; what stays on is the list above this point.
missing_trait_methods = "allow"
module_name_repetitions = "allow"
non_ascii_literal = "allow"
pub_use = "allow"
std_instead_of_alloc = "allow"
str_to_string = "allow"

# Every workspace crate is internal (`publish = false`) and used only by ncrs.
# `#[non_exhaustive]` would force wildcard arms in the app, so a new variant
# would no longer break the build where it has to be handled. `Index` keeps its
# methods in one module per area.
exhaustive_enums = "allow"
exhaustive_structs = "allow"
multiple_inherent_impl = "allow"

# Pixel arithmetic. `layout.rs` computes chrome heights and row counts in f32
# because iced does; `floating_point_arithmetic` would ask for integer maths on
# values that are never integers. The places it is right to be careful —
# casting, dividing, clamping — are the ones with tests.
float_arithmetic = "allow"

# `i % 5` in the test fixtures, to produce a mix of files and directories.
integer_division_remainder_used = "allow"

# `impl Trait` in argument position is the house style; `-> impl Trait` is where
# it hides a type the caller cannot name.
impl_trait_in_params = "allow"

# `where T: X` on the same line as the item. Both are valid; the codebase uses
# the short form and that is a decision, not an oversight.

# `let _ = expr` to drop a must_use value. Clippy wants `let _x: T = expr`,
# which is longer and says the same thing.
let_underscore_untyped = "allow"
let_underscore_must_use = "allow"

# `match x { ... _ => ... }` over an enum is exhaustive-checked by the
# compiler. A wildcard arm is deliberate where a new variant should not break
# the build — `Prompt` has one today and is expected to grow.
wildcard_enum_match_arm = "allow"

# `Default` for a numeric fallback in the test fixtures, and `#[derive(Default)]`
# where a zero value is the right one.
default_numeric_fallback = "allow"

# The byte-index slicing in build.rs. Safe because both helper functions walk
# char_indices, so every index is on a character boundary — verified by running
# the build with a context full of umlauts and an emoji, which strings.json has
# several of. Said again at the function, because the pattern looks risky.
string_slice = "allow"

# Inline modules stay inline. A `#[cfg(test)] mod tests` next to the code it
# tests is the Rust convention and the one this codebase follows; splitting each
# test module into its own file would move a test away from what it verifies.
# Same for the named groups in ui/theme.rs, where 31 call sites read
# theme::colors::SELECTED_BG and the module name says what the constant is for.
#
# These two names only exist in clippy newer than the 1.90 this project used to
# pin. The pin now matches the compiler that builds it, so listing them here is
# what turns them off again — and the seventeen #[allow] attributes and the
# -A unknown-lints flag they needed are gone with it.
inline_modules = "allow"
inline_trait_bounds = "allow"
