[package]
name = "ncrs"
version = "0.1.0"
edition = "2021"
description = "A Norton Commander style dual-panel file manager built with iced"
license = "MIT"

[dependencies]
# x11 and wayland are not optional in practice: iced_tiny_skia depends on
# softbuffer, whose backend enum is generated from #[cfg] arms. Without these
# features no arm applies on Linux, and the generated enum keeps type
# parameters that nothing uses — E0392, and the build fails.
#
# They are ignored on macOS and Windows, where the softbuffer backends are
# cfg'd out anyway, so enabling them costs nothing there.
iced = { version = "0.14", default-features = false, features = ["tokio", "fira-sans", "x11", "wayland"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[features]
default = ["software-rendering"]

# Software rasterisation only: no GPU or driver needed, works on CI runners and
# VMs, but slow on high-resolution displays.
software-rendering = ["iced/tiny-skia"]

# GPU rendering. Faster to draw, needs Vulkan/Metal/DX11 at runtime.
gpu-rendering = ["iced/wgpu"]

# Both: wgpu is tried first, tiny-skia takes over where there is no GPU.
gpu-with-fallback = ["iced/wgpu", "iced/tiny-skia"]

[dev-dependencies]
tempfile = "3.27"
# iced's own UI testing: Simulator (headless), Emulator (end-to-end),
# snapshot images, and Ice scripts.
iced_test = "0.14"
iced_selector = "0.14"
