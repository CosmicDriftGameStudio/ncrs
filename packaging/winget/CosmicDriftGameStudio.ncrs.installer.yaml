# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.10.0.schema.json
# Template: scripts/winget-manifests.sh fills the @...@ placeholders.
PackageIdentifier: CosmicDriftGameStudio.ncrs
PackageVersion: @VERSION@
InstallerType: zip
NestedInstallerType: portable
# ncrs.exe needs the DLLs next to it (llama.dll and the ggml ones). Without this
# winget starts it through a symlink in its Links folder, and Windows looks for
# the implicitly linked DLLs in the folder of the link.
ArchiveBinariesDependOnPath: true
NestedInstallerFiles:
  - RelativeFilePath: ncrs-x86_64-pc-windows-msvc\ncrs.exe
    PortableCommandAlias: ncrs
Installers:
  # Only the normal archive, never ncrs-x86_64-pc-windows-msvc-portable.zip:
  # winget replaces its package folder on an upgrade, so the data folder that
  # makes ncrs portable would take config and index with it.
  - Architecture: x64
    InstallerUrl: @INSTALLER_URL@
    InstallerSha256: @INSTALLER_SHA256@
ManifestType: installer
ManifestVersion: 1.10.0
