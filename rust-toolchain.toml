# Pinned so a new stable cannot turn a green build red overnight.
#
# Only effective with rustup. Homebrew's rust ignores this file, so a local
# "cargo test" can still run a different compiler than CI — install rustup
# (`rustup default stable` plus this pin) if the two must agree.
#
# Raise the pin deliberately, in its own commit. iced pulls thiserror, and
# thiserror 2.0.x fails to build on the very newest compiler (E0392 in the
# `make_dispatch` macro). CI hit exactly that with an unpinned `stable`.
[toolchain]
channel = "1.90.0"
components = ["rustfmt", "clippy"]
