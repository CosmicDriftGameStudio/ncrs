[package]
name = "ncrs-intake"
version = "0.0.0"
edition = "2021"
# Same as the root package: one place decides the compiler.
rust-version = "1.98"
description = "Scan locations, file watcher and duplicate detection for ncrs"
license = "MIT"
publish = false

[lints]
workspace = true

[dependencies]
ncrs-index = { path = "../ncrs-index", version = "0.0.0" }
sha2 = "0.10"
walkdir = "2.5"
same-file = "1.0"
# One recursive watcher per location; the backends (FSEvents, inotify,
# ReadDirectoryChanges) do the per-directory work.
notify = "8"
# pdfium is loaded from a shared library at runtime, never linked: the library
# is a separate download (see scripts/fetch-pdfium.sh) and a missing one must be
# an error the app can show. `pdfium_7881` is the newest API level this crate
# knows; the binaries are newer and stay compatible. `thread_safe` lets the
# pipeline's worker threads share one binding. No `image` feature: pages are
# rendered to raw bytes.
pdfium-render = { version = "=0.9.4", default-features = false, features = ["pdfium_7881", "thread_safe"] }
# Rule patterns from the user run over document text; linear-time matching
# with size limits. Already in the lock through other crates.
regex = "1.13"
# OCR for scans: the engine and the runtime that executes its models. The
# models are not part of the app; see scripts/fetch-ocr-models.sh. They are
# the `.onnx` files, so only that loader is built (no `.rten` flatbuffers).
ocrs = { version = "=0.13.1", default-features = false, features = ["onnx"] }
rten = { version = "=0.26.0", default-features = false, features = ["onnx_format"] }
# Text of .docx and .odt: the zip package and its XML, read in memory with size
# limits. Both are already in the lock; no features, so no extra dependencies.
zip = { version = "=9.1.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = { version = "=0.41.0", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tempfile = { version = "3.27", optional = true }

# O_NOFOLLOW and O_NONBLOCK for opening a file that may have been swapped for
# a link or a FIFO since it was looked at. Already in the lock through notify.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# The PDF page helpers of the tests, for crates that test image text sources.
test-support = ["dep:tempfile"]

[dev-dependencies]
tempfile = "3.27"
