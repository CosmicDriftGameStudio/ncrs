[package]
name = "ncrs-search"
version = "0.0.0"
edition = "2021"
# Same as the root package: one place decides the compiler.
rust-version = "1.98"
description = "The search of ncrs: the file search engine, the filters over the index hits and the state of the search view"
license = "MIT"
publish = false

[dependencies]
# Same as the kit: no renderer or window system, the app picks them.
iced = { version = "0.14", default-features = false, features = ["tokio", "advanced"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# The crates behind ripgrep, as in the app.
ignore = "0.4.33"
globset = "0.4.20"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
grep-matcher = "0.1.9"
unicode-normalization = "0.1.26"
ncrs-core = { path = "../ncrs-core", version = "0.0.0" }
ncrs-index = { path = "../ncrs-index", version = "0.0.0" }
ncrs-i18n = { path = "../ncrs-i18n", version = "0.0.0" }
ncrs-ui-kit = { path = "../ncrs-ui-kit", version = "0.0.0" }

[features]
# `found_hit` and `six_hits`, for the snapshot tests of the app.
test-support = []

[dev-dependencies]
tempfile = "3.27"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }

[lints]
workspace = true
