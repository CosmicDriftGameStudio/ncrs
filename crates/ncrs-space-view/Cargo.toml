[package]
name = "ncrs-space-view"
version = "0.0.0"
edition = "2021"
# Same as the root package: one place decides the compiler.
rust-version = "1.98"
description = "The Platz tab: what takes the space on the drive, what can go safely, and the decisions that stay with the user"
license = "MIT"
publish = false

[dependencies]
# Same as the kit: no renderer or window system, the app picks them.
iced = { version = "0.14", default-features = false, features = ["tokio", "advanced"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
ncrs-config = { path = "../ncrs-config", version = "0.0.0" }
ncrs-core = { path = "../ncrs-core", version = "0.0.0" }
ncrs-filing = { path = "../ncrs-filing", version = "0.0.0" }
ncrs-fs = { path = "../ncrs-fs", version = "0.0.0" }
ncrs-i18n = { path = "../ncrs-i18n", version = "0.0.0" }
ncrs-os-probe = { path = "../ncrs-os-probe", version = "0.0.0" }
ncrs-space = { path = "../ncrs-space", version = "0.0.0" }
ncrs-ui-kit = { path = "../ncrs-ui-kit", version = "0.0.0" }

[features]
# The App Store build: no process list, no worktree removal, no simulators.
sandbox = ["ncrs-space/sandbox"]

[dev-dependencies]
iced = { version = "0.14", default-features = false, features = ["tokio", "advanced", "tiny-skia"] }
iced_test = "0.14"
ncrs-ui-kit = { path = "../ncrs-ui-kit", version = "0.0.0", features = ["test-support"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tempfile = "3.27"

[lints]
workspace = true
