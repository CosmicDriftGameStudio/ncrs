[package]
name = "ncrs-palette"
version = "0.0.0"
edition = "2021"
# Same as the root package: one place decides the compiler.
rust-version = "1.98"
description = "The command line, Quick Open and the command list of ncrs"
license = "MIT"
publish = false

[dependencies]
# Same as the kit: no renderer or window system, the app picks them.
iced = { version = "0.14", default-features = false, features = ["tokio", "advanced"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
nucleo-matcher = "0.3.1"
ncrs-config = { path = "../ncrs-config", version = "0.0.0" }
ncrs-core = { path = "../ncrs-core", version = "0.0.0" }
ncrs-fs = { path = "../ncrs-fs", version = "0.0.0" }
ncrs-i18n = { path = "../ncrs-i18n", version = "0.0.0" }
ncrs-ui-kit = { path = "../ncrs-ui-kit", version = "0.0.0" }

[features]
# `QuickOpen::documents_generation` and `documents_state`, for the tests of the app.
test-support = []

[dev-dependencies]
tempfile = "3.27"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
