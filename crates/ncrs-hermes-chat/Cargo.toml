[package]
name = "ncrs-hermes-chat"
version = "0.0.0"
edition = "2021"
# Same as the root package: one place decides the compiler.
rust-version = "1.98"
description = "The Hermes chat of ncrs: the conversation that reads folders, tidies them and undoes its runs, as a state machine that asks a local model what typed sentences mean"
license = "MIT"
publish = false

[dependencies]
# Same as the kit: no renderer or window system, the app picks them.
iced = { version = "0.14", default-features = false, features = ["tokio", "advanced"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ncrs-ai = { path = "../ncrs-ai", version = "0.0.0" }
ncrs-core = { path = "../ncrs-core", version = "0.0.0" }
ncrs-filing = { path = "../ncrs-filing", version = "0.0.0" }
ncrs-i18n = { path = "../ncrs-i18n", version = "0.0.0" }
ncrs-index = { path = "../ncrs-index", version = "0.0.0" }
ncrs-intake = { path = "../ncrs-intake", version = "0.0.0" }
ncrs-ui-kit = { path = "../ncrs-ui-kit", version = "0.0.0" }

[dev-dependencies]
tempfile = "3.27"
sha2 = "0.11"
ncrs-ai = { path = "../ncrs-ai", version = "0.0.0", features = ["testing"] }
ncrs-pipeline = { path = "../ncrs-pipeline", version = "0.0.0" }
ncrs-fs = { path = "../ncrs-fs", version = "0.0.0", features = ["test-support"] }
ncrs-filing = { path = "../ncrs-filing", version = "0.0.0", features = ["test-support"] }
ncrs-intake = { path = "../ncrs-intake", version = "0.0.0", features = ["test-support"] }

[lints]
workspace = true
