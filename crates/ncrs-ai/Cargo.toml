[package]
name = "ncrs-ai"
version = "0.0.0"
edition = "2021"
# Same as the root package: one place decides the compiler.
rust-version = "1.98"
description = "Asks an AI provider for the document fields the rules left open"
license = "MIT"
publish = false

[lints]
workspace = true

[dependencies]
ncrs-index = { path = "../ncrs-index", version = "0.0.0" }
# The parsers of the rules step: a date or an amount from the AI is read by
# the same code as one from the rules, not by a second implementation.
ncrs-intake = { path = "../ncrs-intake", version = "0.0.0" }
# The model thread lowers its own priority while it reads documents.
ncrs-priority = { path = "../ncrs-priority", version = "0.0.0" }
# Reads the reply of the provider (JSON with comments and trailing commas is
# fine there). The request is written by json.rs: it has no writer, but it is
# already in the lock, and serde_json is not.
jsonc-parser = { version = "=0.34.0", default-features = false }
# The HTTP provider only; same version and features as the app's theme download.
ureq = { version = "=3.5.0", default-features = false, features = ["rustls"] }

# The time of a request in the usage log, and the days the usage page adds up.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# The API key of an own server lives in the keychain; same crate and version as
# the index key in ncrs-index.
keyring = "4.2"

# Checks the model file against its pinned checksum before it is loaded.
sha2 = "0.11"
# The built-in model provider: llama.cpp runs in this process. Versions and
# default features: [workspace.dependencies] in the root Cargo.toml.
llama-cpp-2 = { workspace = true, optional = true }
llama-cpp-sys-2 = { workspace = true, optional = true }

# Windows and x86_64 Linux: Vulkan for the GPU, and the backends (also the CPU
# ones) as modules next to the executable, so a machine without a Vulkan driver
# still runs on the CPU. aarch64 Linux is cross-built on x86_64 and has no arm64
# Vulkan loader, macOS has Metal: both stay static. Keep the condition in step
# with `dynamic_backends` in build.rs.
[target.'cfg(any(target_os = "windows", all(target_os = "linux", target_arch = "x86_64")))'.dependencies]
llama-cpp-2 = { workspace = true, optional = true, features = ["vulkan", "dynamic-backends"] }
llama-cpp-sys-2 = { workspace = true, optional = true, features = ["vulkan", "dynamic-backends"] }

[dev-dependencies]
tempfile = "3.27"
ncrs-intake = { path = "../ncrs-intake", version = "0.0.0", features = ["test-support"] }

[features]
# FakeProvider, for the tests of crates that run a provider.
testing = []
# The built-in model provider (local.rs). Needs cmake and a C++ compiler at
# build time.
llama = ["dep:llama-cpp-2", "dep:llama-cpp-sys-2"]
