[package]
name = "ncrs-filing-view"
version = "0.0.0"
edition = "2021"
# Same as the root package: one place decides the compiler.
rust-version = "1.98"
description = "The filing tab: what the rules make of a source folder, with the user's changes and one run"
license = "MIT"
publish = false

[dependencies]
# Same as the kit: no renderer or window system, the app picks them.
iced = { version = "0.14", default-features = false, features = ["tokio", "advanced"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
ncrs-filing = { path = "../ncrs-filing", version = "0.0.0" }
ncrs-fs = { path = "../ncrs-fs", version = "0.0.0" }
ncrs-i18n = { path = "../ncrs-i18n", version = "0.0.0" }
ncrs-index = { path = "../ncrs-index", version = "0.0.0" }
ncrs-intake = { path = "../ncrs-intake", version = "0.0.0" }
ncrs-ui-kit = { path = "../ncrs-ui-kit", version = "0.0.0" }

[dev-dependencies]
iced = { version = "0.14", default-features = false, features = ["tokio", "advanced", "tiny-skia"] }
iced_test = "0.14"
ncrs-config = { path = "../ncrs-config", version = "0.0.0" }
# The guard that stops a test from reaching the user's config, index or keychain.
ncrs-fs = { path = "../ncrs-fs", version = "0.0.0", features = ["test-support"] }
ncrs-ui-kit = { path = "../ncrs-ui-kit", version = "0.0.0", features = ["test-support"] }
tempfile = "3.27"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[lints]
workspace = true
