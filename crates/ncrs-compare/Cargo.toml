[package]
name = "ncrs-compare"
version = "0.0.0"
edition = "2021"
# Same as the root package: one place decides the compiler.
rust-version = "1.98"
description = "The folder comparison of ncrs: the start dialog, the comparison of two folders, the compare bar and the sync dialog"
license = "MIT"
publish = false

[dependencies]
# Same as the kit: no renderer or window system, the app picks them.
iced = { version = "0.14", default-features = false, features = ["tokio", "advanced"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
# The scratch folder the files of a server or an archive are read into when
# their content is compared.
tempfile = "3.27"
ncrs-core = { path = "../ncrs-core", version = "0.0.0" }
ncrs-fs = { path = "../ncrs-fs", version = "0.0.0" }
ncrs-i18n = { path = "../ncrs-i18n", version = "0.0.0" }
ncrs-ui-kit = { path = "../ncrs-ui-kit", version = "0.0.0" }

[dev-dependencies]
# The snapshots of the dialogs.
iced_test = "0.14"
iced = { version = "0.14", default-features = false, features = ["tokio", "advanced", "tiny-skia"] }

[lints]
workspace = true
